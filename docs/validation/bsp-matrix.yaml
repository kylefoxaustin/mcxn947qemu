# MCXN947 (frdm-mcxn947) QEMU — validated BSP / firmware matrix
#
# Which officially-supported BSPs + firmware sets THIS model is validated to
# boot. The emulator session OWNS this list; downstream tools (e.g. Holobench's
# version picker) READ it via `status:` — they do not guess a compatibility
# matrix.
#
# DIFFERENT AXIS from the i.MX boards (95/93/91): the MCXN947 is a bare-metal /
# RTOS Cortex-M MCU — there is NO NXP *Linux* BSP, no kernel/dtb/.wic/SM. Its
# "BSP versions" are the two officially-supported firmware stacks:
#   * Zephyr RTOS        (kind: zephyr)
#   * NXP MCUXpresso SDK (kind: mcuxpresso)
# Same matrix shape as 95's docs/validation/bsp-matrix.yaml; board-specific kinds.
# Chosen for DIFFERENCE, not recency-depth: pinned dev stack + a latest/forward
# canary per kind. Boot is bare `-M frdm-mcxn947 -kernel <elf>` (no -dtb/-initrd/
# -smp; cpu1 stays in reset). Boot-smoke = reach the firmware's banner marker via
# tests/bsp-matrix/run.sh.
#
# REDISTRIBUTION: Zephyr ELFs are Apache-2.0 (staged + shippable). MCUXpresso SDK
# binaries are NOT redistributable — operator-built locally, kept out of the repo;
# the matrix entry records the build recipe + marker, run.sh skips if absent.
board:        frdm-mcxn947
qemu_machine: frdm-mcxn947          # QEMU -M
soc:          MCXN947               # dual Cortex-M33 (cpu0 wired; cpu1 via SYSCON release)

entries:
  - label:             zephyr-v4.4
    kind:              zephyr
    status:            validated                 # boot-smoke PASS + hello/blinky/DHCP/TCP/UDP green
    version_line:      "Zephyr v4.4.0 (build v4.4.0-5250-gc2d0717c4697)"
    board_target:      frdm_mcxn947/mcxn947/cpu0
    toolchain:         gnuarmemb (ZEPHYR_TOOLCHAIN_VARIANT=gnuarmemb, GNUARMEMB_TOOLCHAIN_PATH=/usr)
    artifact:          ~/mcxn-images/mcxn-hello.elf      # Apache-2.0, redistributable
    smoke_marker:      "Hello World! frdm_mcxn947"
    extra_artifacts:   [mcxn-blinky.elf, mcxn-dhcp.elf, mcxn-echo.elf, mcxn-enet-lab.elf]
    validated_against: HEAD                       # model commit this entry was last booted on
    notes:             primary RTOS contract; full net stack (DHCP/TCP/UDP) + raw-L2 cross-board all green.

  - label:             mcuxpresso-sdk-2.16
    kind:              mcuxpresso
    status:            validated                 # SDK hello PASS + 113/148 driver_examples PASS, 0 CPU faults
    version_line:      "MCUXpresso SDK 2.16.100"
    cpu_define:        CPU_MCXN947VDF_cm33_core0
    toolchain:         arm-none-eabi-gcc (-mcpu=cortex-m33 -mfloat-abi=hard -mfpu=fpv5-sp-d16)
    build_recipe:      tests/mcxn-mcuxpresso/build.sh   # builds from local BSD mcux-sdk + CMSIS_5 checkouts
    corpus_harness:    ~/mcux-ws (run-example.sh / batch-examples.sh — drives NXP's own armgcc CMake)
    artifact:          ~/mcux-build/mcux-hello.elf      # NOT redistributable; operator-built, out of repo
    smoke_marker:      "MCUXPRESSO-SDK-PASS"
    corpus_evidence:   docs/validation/mcuxpresso-corpus-scorecard.tsv   # 113 PASS / 22 RAN / 13 BLDFAIL / 0 FAULT
    validated_against: HEAD
    notes: >
      The stock NXP SDK driver path (startup + fsl_clock + fsl_lpflexcomm/fsl_lpuart
      + debug console). The 155-example corpus is a deeper-than-boot-smoke validation:
      every BOARD_InitPins/driver init runs the real NXP drivers. The PORT sub-word
      (16-bit PCR) MMIO access this surfaced was a real model fix.

  - label:             zephyr-mainline
    kind:              zephyr
    status:            candidate                 # forward-compat canary; rebuild hello on Zephyr main, boot-smoke, promote
    version_line:      "Zephyr main (latest)"
    board_target:      frdm_mcxn947/mcxn947/cpu0
    smoke_marker:      "Hello World! frdm_mcxn947"
    notes:             driver-churn canary across Zephyr release lines — west update to main, rebuild hello, boot-smoke.

  - label:             mcuxpresso-latest
    kind:              mcuxpresso
    status:            candidate                 # forward-compat canary for the next SDK major
    version_line:      "MCUXpresso SDK latest (> 2.16)"
    smoke_marker:      "MCUXPRESSO-SDK-PASS"
    notes:             fetch the newer mcux-sdk/examples pin, rebuild via tests/mcxn-mcuxpresso/build.sh, boot-smoke, promote.

# boot-smoke markers (firmware-side; MCX is bare-metal so no kernel/SCMI markers):
smoke:
  zephyr:     "Hello World! frdm_mcxn947"
  mcuxpresso: "MCUXPRESSO-SDK-PASS"
