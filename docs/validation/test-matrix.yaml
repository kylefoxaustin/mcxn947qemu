# MCXN947 machine-readable test/result matrix — twin of test-result-matrix.md.
# Fleet-convergence schema (95emulator proposal): one row per IP block the chip
# HAS; columns block/present/driver_binds/class/tested_by/result.
# Chip-accuracy rule: absent silicon gets NO row (never a false negative).
# class: computes | functional | operator-driven | register-only |
#        not-modelled
#        (flag-at-operator: DEPRECATED -- it defined "op acked + truth via QMP" as
#         safe, but QMP reaches the OPERATOR, not the guest.  It authorised four
#         real bugs here.  Anything a guest reads must be honest-fault.)
# result is from an actual run; class/driver_binds are human fidelity judgments.

meta:
  chip: MCXN947
  machine: frdm-mcxn947
  generated: "2026-06-29"          # hand-authored; CI-generation is the next step
  suites_total: 40
  suites_pass: 40
  deltas_vs_linux_boards:
    - "no linux-boot rows (M33 MCU, not a Linux AP)"
    - "no in-guest-build rows (cross-build + run-on-core; the run half is the code-sweep)"
    - "adds the operator-driven class (analog inputs injected via QOM)"

cores:
  - {block: cortex-m33-cpu0, present: true,  driver_binds: true, class: functional, tested_by: [mcxn-zephyr, mcxn-ztest, mcxn-mcuxpresso], result: pass}
  - {block: cortex-m33-cpu1, present: true,  driver_binds: true, class: functional, tested_by: [mcxn-dualcore, mcxn-mailbox, mcxn-reboot], result: pass, note: "cpu1 is SYSCON-released by cpu0 firmware, and the release re-runs on system_reset (mcxn_syscon_reset clears cpu1_running + restores CPUCTRL held-in-reset), so a guest reboot brings both cores back -- proven boot->QMP system_reset->both banners again, mutation-checked (tests/mcxn-reboot). Guards the secondary-core reboot-hang send-blocker class"}
  - {block: wfi-idle,        present: true,  driver_binds: true, class: functional, tested_by: [mcxn-idle], result: pass}

connectivity:
  - {block: usbfs0,    present: true, driver_binds: true, class: functional, tested_by: [mcxn-usb, mcxn-usb-host, mcxn-usb-host-msc], result: pass, note: "host mass storage (2026-07-26b): the same host engine (no model change) also drives the bulk path -- mcxn-usb-host-msc attaches a real usb-storage device (a raw disk image), enumerates it, SET_CONFIGURATION, then reads block 0 with a SCSI READ(10) over Bulk-Only Transport (CBW out on bulk-OUT EP2, 512 bytes in across eight 64-byte packets on bulk-IN EP1, then the CSW) and verifies the actual backing-image contents (an 'MCXN-USB' signature + a DE AD BE EF tail -- a host file the model cannot fabricate). It also handles the real MSC quirk: a freshly-reset SCSI disk fails its first command with a UNIT ATTENTION (power-on reset), so the firmware retries exactly as a real host does. mcxn-usb-host-msc now also writes block 1 with SCSI WRITE(10) (CBW + 512 bytes bulk-OUT + CSW), reads it back, and the harness RE-CHECKS the BACKING file on the host after QEMU exits -- the written bytes must have reached the real image, an oracle neither the guest nor the model can fake (the uSDHC pattern). The bulk-OUT data path and the async .complete path are both closed here: usb-storage's block write completes ASYNC, so the CSW-IN finishes through the controller's port .complete callback (verified: 3 async completions in a run). Mutation-proven: skip the device<->guest data copy -> reads/writes come back wrong -> FAIL (the disk bytes are proven real, not fabricated). --- host mode (2026-07-26): the KHCI was device-only (a device on a remote host's bus via usbredir); now it is also a USB host -- CTL[HOSTMODEEN] gives the controller its own single-port full-speed usb-bus, a QEMU USB device attaches (`-device usb-kbd,bus=usb-bus.0,port=1`), and the guest writing token launches one real transaction the model drives to the attached device via usb_handle_packet (SETUP/OUT from the TX BD, in into the RX BD; ping-pong ODD tracked). CTL[RESET] drives a USB bus reset (usb_device_reset) so the device leaves ATTACHED for the addressable DEFAULT state -- the missing step without which usb_find_device returns nothing. mcxn-usb-host: a bare-metal KHCI host driver enumerates a real usb-kbd -- reads its 18-byte device descriptor (asserts idVendor 0x0627 / idProduct 0x0001, so the bytes are the actual device's, not a fabricated reply), SET_ADDRESS(5), re-reads at the new address. Mutation-proven on both axes that matter: skip the device->guest data copy -> VID reads 0 -> FAIL (proves real data, not fabrication); skip the CTL[RESET] device reset -> the device never becomes addressable -> timeout -> FAIL. Seam: async interrupt-IN (live hid reports) uses the port .complete path but is not yet exercised by a test; hub-downstream enumeration (QEMU auto-inserts a hub without an explicit port=) is not walked."}
  - {block: usbhs1,    present: true, driver_binds: true, class: functional, tested_by: [mcxn-usb-hs], result: pass}
  - {block: enet,      present: true, driver_binds: true, class: functional, tested_by: [mcxn-enet, mcxn-enet-mac, mcxn-enet-tcp, mcxn-enet-udp, mcxn-enet-tcpip, mcxn-enet-x2, mcxn-enet-lab], result: pass}
  - {block: flexcan,   present: true, driver_binds: true, class: functional, tested_by: [mcxn-flexcan, mcxn-flexcan-rx, mcxn-can-link], result: pass, note: "RX path fixed 2026-07-12: the board-to-board receive path did NO ID matching (a frame landed in the first empty mailbox whatever ID it filtered for, so a driver trusting its own filter read someone else's frame), silently dropped a frame when no mailbox was free (the RM says overwrite and set CODE=OVERRUN — the data moves and the guest is told), and never checked MCR[MDIS] (a switched-off controller kept receiving). Found by sweeping for gates that can never say no: flexcan_bus_can_receive() returned true unconditionally. ⚠ named gap, in the permissive DIRECTION: BIT TIMING is not modelled. QEMU's CanBus is MESSAGE-level by design -- frames are exchanged as messages, not bits -- so CTRL1[PRESDIV]/CBT are stored and cannot AFFECT DELIVERY. Every node on a QEMU CanBus talks to every other regardless of its configured bitrate. On silicon a mis-computed PRESDIV means the node cannot COMMUNICATE at all. So this model is more permissive than the silicon: a developer who gets their bit timing wrong passes here and is dead on the board, and QEMU told him he was right. This is a property of QEMU's CAN infrastructure, not of this model, and it is recorded as a decision rather than discharged by a flag -- but it is the same class as the ungated eDMA requests, and it is the direction that reaches the customer"}
  - {block: lpuart,    present: true, driver_binds: true, class: functional, tested_by: [mcxn-multiuart, mcxn-flexcomm, mcxn-uart-dma, mcxn-lpuart-edma-stock], result: pass, note: "reset values from the RM (2026-07-12): BAUD = 0x0F00_0004 (OSR=15 -- the SDK divides by OSR, and 0 is a divide-by-zero waiting for a baud calculation), TOSR = 0xF, DATA[RXEMPT] set when the receiver is empty (reading 0 instead means 'a NUL byte arrived', and a guest polling DATA rather than STAT cannot tell those apart). FIFO[RXFIFOSIZE]/[TXFIFOSIZE] are read-only CAPABILITY fields (reset 0x22): they were 0 (= the smallest FIFO) and stored, so the SDK's `base->FIFO = ...` during init would have overwritten the part'S OWN description of itself. A capability register software can change is not a capability register"}
  - {block: lpspi,     present: true, driver_binds: true, class: functional, tested_by: [mcxn-flexcomm, mcxn-spi-link, mcxn-lpspi-nor], result: pass, note: "real SPI master -> a real m25p80 SPI-NOR (2026-08-01): the SoC wires a genuine QEMU w25q64 onto FlexComm1's LPSPI SSI bus with its chip-select connected, and the LPSPI now DRIVES CS -- asserted (active low) before the first frame, held while TCR[CONT] is set, dropped on the frame that clears CONT -- so a multi-byte NOR command is one transaction. mcxn-lpspi-nor reads the JEDEC ID (0xEF 0x40 0x17, from the flash) and does WREN+page-program+read-back byte-exact through the flash's own storage (the WREN latch and erase-state physics are the flash's, not faked); mutation-proven (sever the CS assert -> flash deselected -> FAIL; corrupt the TX byte -> ID/readback wrong -> FAIL). This replaced a LOOPBACK: with no device TDR looped straight into RDR (a MOSI->MISO jumper), so a transfer returned its own bytes -- the model was its own oracle. Loopback remains for a FlexComm with no bus (mcxn-flexcomm FC3); the b2b spi-link (FC5) is unaffected (its CS line is unwired). --- TCR reset = 0x1F (FRAMESZ=31, i.e. a 32-bit frame) from the RM; it was 0, which is a 1-bit frame. RSR[RXEMPTY] was already correct -- the sweep flagged it only because the differential read it at PERSEL=0, where the window decodes as LPUART"}
  - {block: lpi2c,     present: true, driver_binds: true, class: functional, tested_by: [mcxn-flexcomm, mcxn-lpi2c-eeprom], result: pass, note: "real I2C master -> a real device (2026-07-31): the LPI2C now drives a genuine QEMU I2C bus (named <flexcommN>-i2c) and the test attaches a real at24c EEPROM to it. The command engine (MTDR CMD field) does actual bus transactions -- i2c_start_transfer / i2c_send / i2c_recv / i2c_end_transfer -- START+addr with the R/W bit, TX bytes, RX (DATA+1) bytes drained lazily by MRDR (one lookahead + a pending count, so a multi-byte read needs no deep FIFO), and STOP. A device that does not ACK sets MSR[NDF] (a real NACK). mcxn-lpi2c-eeprom writes two bytes and reads them back byte-exact from the EEPROM's own storage, and an absent address NACKs -- mutation-proven (corrupt the TX data -> readback mismatches -> FAIL; ignore the NACK return -> the absent device is not detected -> FAIL). this replaced A fabrication: the LPI2C used to have NO bus -- a 'tiny echo target' ACKed every address and returned the last transmitted byte, so a read-after-write always 'worked' and the model was its own oracle (the uSDHC bug class). tests/mcxn-flexcomm relied on that echo and was updated to a real EEPROM write-then-read at the same time (a mirror test, un-mirrored). Scope: the LPI2C slave engine (SCR/SSR/SASR/SRDR) is still not modelled (reports honestly empty). --- ⚠ the whole IP was at the wrong address and nobody noticed (fixed 2026-07-12). CMSIS: LP_FLEXCOMM0_BASE = LPUART0_BASE = LPSPI0_BASE = 0x4009_2000, but LPI2C0_BASE = 0x4009_2800 -- the LPI2C sub-block sits at +0x800 in the FlexComm window and the other two do not. The model decoded it at +0x000, so every LPI2C REGISTER ACCESS from real firmware (which of course uses LPI2C0_BASE) LANDED in an UNMAPPED hole and was silently dropped: reads 0, writes on the floor. The IP was unreachable from the guest, and the stock lpi2c examples printed a banner and then did nothing forever because LPI2C_MasterInit()'s every write fell into that hole. and tests/mcxn-flexcomm passed through all of it, because it took its addresses from the model: it poked +0x10, the model answered at +0x10, and the two agreed perfectly about a register that is not there on the part. A TEST that gets its addresses from the model is not A TEST, it is A mirror -- and mutation testing cannot see it, because mutating the model moves the mirror TOO. It took an oracle I did not write (the RM's reset values, read back at the addresses CMSIS gives) to notice nobody was home. Also fixed: MSR[TDF] was gated on MEN (RM resets it to 1 with MEN clear -- an empty FIFO has room whether or not you enabled it). (The 'no I2C bus' gap this note used to end on is CLOSED -- see the real-bus paragraph at the top; the slave engine remains the one honest gap.)"}
  - {block: i3c,       present: true, driver_binds: true, class: functional, tested_by: [mcxn-i3c], result: pass, note: "tier A re-earned 2026-07-12: the controller drives a real I2C bus (I3C is I2C-compatible in legacy mode). The model supplies the bus as the silicon does and does not invent a device onto it; the test attaches a genuine QEMU at24c EEPROM and the bytes read back byte-exact. An absent target NACKs (MERRWARN) instead of reporting a completed transfer"}
  - {block: usdhc,     present: true, driver_binds: true, class: functional, tested_by: [mcxn-usdhc], result: pass, note: "tier A re-earned 2026-07-12: drives a real QEMU sd-card on an sd-bus with a real ADMA2 descriptor walk. Golden is a host image file the model cannot reach, re-checked on the host after QEMU exits. An empty slot times out (CTOE) instead of the host answering for an absent card. It previously had NO data path at all and conjured the card's responses — and passed the mutation audit anyway, because the model was its own oracle"}
  - {block: flexspi,   present: true, driver_binds: true, class: functional, tested_by: [mcxn-flexspi, mcxn-flexspi-nor, mcxn-xip, mcxn-qspi-boot], result: pass, note: "QSPI execute-in-place boot (2026-07-24): `-machine frdm-mcxn947,qspi-boot=on` resets the M33 from the external FlexSPI NOR (secure XIP alias 0x9000_0000) instead of internal flash -- the production boot mode where there is NO internal-flash image. The boot ROM's essential precondition is modelled: a valid FlexSPI Config Block (tag 'FCFB' = 0x42464346 at NOR offset 0x400) must be present or the image is rejected, loud and fatal (error_report + exit) -- exactly what a developer whose image lacks the .flexspi_fcb section sees on silicon. mcxn-qspi-boot proves both axes: an FCB-carrying QSPI-linked image boots and runs in place from the NOR (every instruction fetched from 0x9000_0000; prints QSPI-BOOT PASS after computing 1^2+..+10^2=385 in place), and an FCB-less image is rejected. Mutation-proven on both: kill the FCB check -> the FCB-less negative control is no longer rejected -> FAIL; kill the init-svtor reroute (reset from internal flash) -> the QSPI image never boots -> FAIL. ⚠ modelled seam, STATED: the boot ROM's FlexSPI *configuration* from the FCB lookup-table is not replayed -- the AHB NOR window is a live mirror the CPU fetches from directly, so only the FCB *tag* is validated (the ROM's go/no-go gate), not the LUT/timing fields a real ROM parses to program the FlexSPI controller. The XIP data path itself (LUT-driven NOR reads) is covered by mcxn-xip/mcxn-flexspi-nor."}
  - {block: sai,       present: true, driver_binds: true, class: functional, tested_by: [mcxn-sai], result: pass, note: "the MCLK is now derived (2026-07-21): the SAI takes a Clock input driven by SYSCON SAI0/1CLKSEL/CLKDIV (CLOCK_GetSaiClkFreq: 1=PLL0, 2=ExtClk, 3=FRO_HF, 4=PLL1/PLL1CLK0DIV), so the audio rate is derived from the source firmware selects and follows a PLL reconfigure -- the old hardcoded 12.288 MHz constant is gone (12.288 is now a real config: PLL1 set to an audio multiple, SAI0CLKSEL=4). No source selected -> 0 Hz -> the SAI has no bit clock and does not clock data. mcxn-sai now proves the derivation, which the MCLK-independent ratio sweep structurally could not: it measures the same word config with the SAI clock on FRO_HF (48 MHz) then PLL0 (150 MHz) and the FRO_HF drain takes 150/48 = 3.125x more SysTick ticks (golden from the SDK's source rates, not the model). Mutation-proven: pin the SYSCON SAI mux to a constant -> ratio 1.0 -> FAIL (and both drains hit the timeout, the old hardcode's signature). SAI-dependent tests (sai-dma) now CLOCK_AttachClk(kFRO_HF_to_SAI0) first. --- tier A re-earned 2026-07-12, and the word RATE earned separately: the rate claim (TCR2[DIV]/TCR5[W0W]) was in this table for weeks with nothing testing it -- mutation testing proved it, making the model ignore TCR2[DIV] left the suite green because the words still moved byte-exact, just at the wrong RATE, which for an I2S link is the whole point. Now measured against SysTick under -icount and swept on both axes (DIV and W0W): sweeping DIV alone was a degenerate shape, since with the word length frozen at 32 bits a model that hardcoded bits=32 is bit-identical -- and that mutation duly survived until W0W was swept too. The check is MCLK-INDEPENDENT by construction (the period scales as BITS*(DIV+1), a ratio in which the nominal MCLK cancels), so it verifies what the RM specifies without leaning on a modelling assumption. Real 8-word TX/RX FIFOs; audio words move byte-exact through a board-level TXD->RXD jumper (loopback property, not an invented register bit); overrun on a full FIFO and underrun on an empty one are real"}
  - {block: emvsim,    present: true, driver_binds: true, class: register-only, tested_by: [mcxn-emvsim], result: pass}
  - {block: mailbox,   present: true, driver_binds: true, class: functional, tested_by: [mcxn-mailbox, mcxn-dualcore], result: pass}

timers:
  - {block: ctimer, present: true, driver_binds: true,  class: functional, tested_by: [mcxn-ctimer, mcxn-timers, mcxn-ctimer-dma, mcxn-ctimer-capture], result: pass, note: "input capture (2026-07-30): a capture-input edge (a CTIMER pin selected by INPUTMUX's CTIMERnCAPm mux) latches the live counter into CR0 -- the 'timestamp an event / measure a pulse width' path. It was dead: CR0..3 were read-only storage nothing ever loaded, so a capture driver read a frozen zero. The pin has no signal source in emulation, so it is operator-driven via the `capture-input` QOM property (the FlexPWM-capture / CMP-output seam); CCR[CAP0RE]/[CAP0FE] select the edge and CCR[CAP0I] gates the IR[CR0INT] interrupt (the CR0 load itself happens on the selected edge regardless of CAP0I). mcxn-ctimer-capture runs CTIMER0 free, arms rising-edge capture, and the operator drives a rising edge (CR0 latches a live TC < the current TC, IR[CR0INT] set) then a falling edge (ignored, CAP0FE clear); mutation-proven (sever the CR0 latch -> FAIL; ignore the edge-select -> the falling edge wrongly captures -> FAIL). Scope: capture channel 0 (1..3 share the logic, no injection seam); CTCR edge-count modes unmodelled. --- the clock selector now decides the RATE (2026-07-12). CTIMER was hardwired to sysclk and ignored SYSCON[CTIMERCLKSEL] entirely, behind this line: `return hz ? hz : 150000000;  /* fallback if the clock tree isnt driven */`. Every stock NXP example does CLOCK_AttachClk(kFRO_HF_to_CTIMER0) and then computes its match values from CLOCK_GetCTimerClkFreq() = 48 MHz -- and we ticked the timer at 150 MHz. every CTIMER delay was 3.1x TOO short, silently. Measured against SysTick before the fix: 12011 ticks where the SDKs own arithmetic expects 150000. the fallback was the camouflage, and its own comment announced that the clock tree might not be driven and then made that fact undetectable -- a ?: is not a safety net, it is a place for a bug to live where no test will look. Now: SCG publishes its real sources (fro12m gated by SIRCCSR[SIRC_CLK_PERIPH_EN]; frohf = 0 / 48 / 144 MHz from FIRCCSR[FIRCEN] + FIRCCFG[RANGE], mirroring CLOCK_GetFroHfFreq exactly -- it must mirror it, because the guest computes its rate from those same registers and programs its timers from the answer), SYSCON muxes them per CTIMERCLKSEL[n] and divides by CTIMERCLKDIV[n], and the CTIMER runs at what it is actually given. PLL0/PLL1 are now derived too (2026-07-19; CTIMERCLKSEL 1=PLL0, 2=PLL1/div -- see the scg row and mcxn-pll-ctimer); the sources we still cannot derive (SAI) report 0 Hz and say so loudly -- a stopped timer is found in an hour; a plausible wrong rate ships. The test now sweeps selector and DIVIDER with goldens that are RATIOS from the SDKs own source rates (FRO_HF/FRO12M = 4.00x exactly; FRO_HF/4 == FRO12M), so they do not depend on our assumed sysclk at all -- measured 3.99x and 1.00x. The old test counted interrupts and never ATTACHED A clock, something no real firmware does; it could not have caught any of this, because the INTERRUPTS still arrive -- only at the wrong time"}
  - {block: mrt,     present: true, driver_binds: true, class: functional,    tested_by: [mcxn-timers, mcxn-mrt], result: pass, note: "MRT clock is now derived (2026-07-19b): it runs on the AHB/bus clock = the SCG main clock (kCLOCK_Mrt is an AHB_CLK_CTRL1 gate, no selector), so it follows the core -- 48 MHz at the FRO_HF reset, 150 MHz once firmware brings up PLL0 -- instead of the old raw-sysclk 150 MHz constant (and the `?: 150000000` fallback is gone: a bus clock the SCG reports as 0 means the timer does not run, not a plausible 150). mcxn-mrt proves it at the reset clock without configuring the PLL: MRT and SysTick both derive from the main clock, so 200000 MRT counts == 200000 SysTick ticks whatever that clock is; pin MRT to a 150 MHz constant while SysTick sits at the 48 MHz reset clock and it reads ~64000 -> FAIL."}
  - {block: lptmr,   present: true, driver_binds: true, class: functional,    tested_by: [mcxn-timers, mcxn-lptmr], result: pass, note: "clock selected by PSR[PCS] (2026-07-21b): the LPTMR ran on the 150 MHz bus clock, ignoring PSR[PCS] -- but it is a low-power timer (max 25 MHz), so 150 MHz is impossible on silicon and a driver selecting FRO_12M got a rate 12.5x too fast, silently. RM rev 7 Table 463 gives the source table: 00 FRO_12M (12 MHz, from the SCG) / 01 FRO_16K (16 kHz) / 10 32K_CLK (32.768 kHz) / 11 OSC_SYS (external crystal). FRO_12M is now driven from the SCG fro12m clock; the 16 kHz/32 kHz are fixed low-power oscillators (the same constants SYSCON uses for OSTIMER); OSC_SYS is a board seam (no crystal modelled -> 0 Hz, loud, timer does not run). The 150 MHz fallback is gone. mcxn-lptmr measures against SysTick (core at a known 150 MHz): FRO_12M is 12.5 SysTick ticks/count (the old 150 MHz gives 1.0 -- caught), and the same count at 32K takes 12M/32768 = ~366x longer (a model ignoring PCS reports the same rate -> ratio 1 -- caught). Both mutation-verified."}
  - {block: ostimer, present: true, driver_binds: true,  class: functional, tested_by: [mcxn-ostimer, mcxn-timers], result: pass, note: "the selector now decides the RATE -- the first real slice of a clock tree (2026-07-12). The device declared a Clock input and the SoC never connected it, so this line fired every single time: `return hz ? hz : OSTIMER_HZ;` (1 MHz). the fallback was the camouflage: the model had exactly the right structure and a default that made the missing wiring invisible, and SYSCON[OSTIMERCLKSEL] -- the register that chooses the rate -- was consumed by nothing. A guest selecting the 16 kHz source got a timer running at 1 MHz, sixty-two times TOO fast, silently. SYSCON now drives the clock from OSTIMERCLKSEL per the SDK's own switch (0 -> 16000 Hz, 1 -> 32768, 2 -> 1000000, default -> 0 = NO clock, and 3 is the reset value), and the fallback is gone: a timer with no clock selected does not run, which is what silicon does. The test now sweeps the selector and measures against SysTick; its golden is a RATIO from the SDK's own constants (1000000/16000 = 62.5x), so it does not depend on our assumed sysclk at all -- a model that ignores the selector produces 1.0 and fails. Measured 9375 SysTick ticks per OSTIMER count at 16 kHz = 150 MHz / 16000, exactly. ⚠ The old test never selected a clock at all -- something no real firmware does (the SDK calls CLOCK_AttachClk) -- and the model's default quietly rescued it; when the default was removed this TEST was the first thing to FAIL, which is exactly what should have happened"}
  - {block: sct, present: true, driver_binds: true,  class: functional, tested_by: [mcxn-sct, mcxn-sct-dma, mcxn-sct-input], result: pass, note: "input-conditioned EVENTS (2026-07-30): an SCT input pin (AIN0..7, selected by INPUTMUX's SCT0_INMUX mux) now DRIVES an event -- when the input changes, each event whose EV[n].CTRL selects COMBMODE=IO / OUTSEL=input / IOSEL=that pin, and whose IOCOND matches the transition, and which is active in the current state (EV[n].STATE has the state bit), latches EVFLAG[n] and (gated by EVEN[n]) raises the SCT interrupt. It was absent: only the match/limit event 0 (the counter path) existed, so an SCT wired to act on a pin did nothing. The pin has no signal source in emulation, so it is operator-driven via the `sct-inputs` QOM property (the CTIMER-capture / CMP-output seam). mcxn-sct-input arms EV1(input0,rise) + EV2(input3,rise) and the operator drives only input0: EV1 fires and EV2 does not (IOSEL routing), then a falling edge is ignored (IOCOND edge-gate). Mutation-proven on all three axes: sever the EVFLAG latch -> FAIL; force IOSEL=0 -> the input-3 event wrongly fires on input0 -> FAIL; make RISE always-fire -> the falling edge triggers -> FAIL. Scope: COMBMODE=IO with the EVFLAG+even interrupt effect; the OR/AND-with-match combinations, event->output actions and state-machine transitions are a stated boundary (no output/multi-state machinery in the base model). --- the SCT now runs at the RATE the clock tree gives it (2026-07-13), and it did not before: it was hardwired to a 150 MHz constant while the comment six lines above that constant said, correctly, `Per the RM the counter is clocked from the SCT clock (SYSCON SCTCLKSEL/SCTCLKDIV)`. it named the REGISTER that decides the RATE and then ignored it. Every stock example does CLOCK_AttachClk(kFRO_HF_to_SCT) -- FRO_HF, 48 MHz -- so the SCT was ticking 3.1x TOO fast. and the TEST could not see it because the TEST shared the assumption: it predicted SysTick ticks as (MATCHREL+1)*(PRE_L+1), which is only true if the SCT clock equals the CPU clock -- the models constant, not silicons. Model and test were wrong together and it passed. Its own header even claimed `the test must not depend on the absolute frequency, and does not` -- it did. A mirror that declares itself is still A mirror, and this one declared itself and then denied it in the same paragraph. (rt1180emulator shipped the identical specimen: a PWM golden whose comment read `if PWM_CLK were wrong, this golden would be wrong in exactly the same direction and still PASS`. It was. It did.) The test now programs the clock as firmware does and sweeps three axes with goldens that are RATIOS from the SDKs own source rates: CTRL[PRE_L] (/1,/2,/8), SYSCON[SCTCLKDIV] (/1,/4), and the source itself (FRO_HF 48 -> 144 MHz via FIRCCFG[RANGE], exactly 3x). A model that ignores the clock tree reports the same period at 48 and 144 MHz and fails. All three mutation-verified. Measured base moved from ~2052 ticks (the old, wrong, 150 MHz) to 6416 (the real 48 MHz) -- the old golden would now FAIL, which is what `wrong in the same direction` means"}
  - {block: pwm,     present: true, driver_binds: true, class: functional,    tested_by: [mcxn-pwm, mcxn-flexpwm-dma, mcxn-flexpwm-capture, mcxn-flexpwm-fault, mcxn-flexpwm-output, mcxn-flexpwm-deadtime, mcxn-flexpwm-pwmx, mcxn-adc-pwm-trig], result: pass, note: "output trigger -> ADC (2026-07-27, the motor-control synchronous-sampling path): TCTRL[OUT_TRIG_EN] bit n makes the VALn compare pulse PWM_OUT_TRIG0 (even n) / TRIG1 (odd n) mid-carrier; routed through INPUTMUX (SM0 selectors 24/25 for PWM0, 32/33 for PWM1) the ADC samples phase-current at that exact counter position, CPU-free. This was inert before -- OUT_TRIG_EN was a stored bit and the submodule emitted no trigger, so kINPUTMUX_Pwm0A0Trig0ToAdc0 routed a signal that never pulsed. It needed real mid-period compare timing: unlike the value-DMA request (reload boundary), an output trigger fires at the VALn count inside the period, so it has its own compare timer (the reload timer only knows the period edge). mcxn-adc-pwm-trig drives FlexPWM0 SM0 -> ADC0 and asserts DATA (operator-set sample, VALID) + RATE (4 conversions span ~4 carrier periods of SysTick -- paced by the carrier, not instant); mutation-proven on the pulse (sever OUT_TRIG0 -> no conversion) and OUT_TRIG_EN (ignore it -> an unenabled decoy VAL2 also triggers -> ~2 conversions/period -> the RATE floor FAILs). Scope: submodule 0, full rate (TCTRL[TRGFRQ] every-other-period division is a stated seam). --- PWM_X AUXILIARY output (2026-07-25b): the submodule's third output, generated independently of the A/B pair -- SET at VAL0 (effective VAL0+1), reset at VAL1, so high in (VAL0,VAL1); OCTRL[POLX] inverts, OUTEN[PWMX_EN] gates, a DISMAP-mapped latched fault forces it OFF. Exposed via read-only `pwm-x-output`; mcxn-flexpwm-pwmx sweeps compare/POLX/OUTEN/fault, 4 mutations each FAIL their axis. ⚠ FRACVAL fractional-delay dead-time remains an HONEST seam (deliberately not faked): it is a cross-cycle DITHER (FRCTRL[FRACx_EN] accumulates a fractional value every PWM cycle and adds a whole count only every 1/frac cycles -- RM 54.3.4.4 'every 4 cycles 1 clock longer'), so it needs a running fractional accumulator + edge-timing averaged over many cycles, neither of which fits the static-position output model; a fixed fractional offset would misrepresent the dither. This closes the FlexPWM output saga (carrier -> value/capture DMA -> fault -> output waveform -> dead-time -> PWM_X); only FRACVAL remains, stated. --- DEAD-TIME insertion + COMPLEMENTARY pair (2026-07-25). The 0x07FF DTCNT reset value now has an observable waveform effect: in complementary mode (CTRL2[INDEP]=0, the reset default) PWM_B is the complement of PWM_A, and dead-time is inserted on each leading edge (PWM_A's 0->1 at VAL2 delayed by DTCNT0, PWM_B's at VAL3 by DTCNT1), forcing both outputs inactive during the delay -- the dead band that stops shoot-through through both inverter transistors. DTCNT is in IPBus cycles regardless of PRSC (dead counts = DTCNT>>PRSC). PWM_B is now exposed via a read-only `pwm-b-output` QOM property alongside pwm-a-output; the dead band reads as both false at once. mcxn-flexpwm-deadtime holds the static counter at 6 positions (both dead bands, both active regions, + the direct withdead/nodead discriminator: same INIT=VAL2, dead-time toggled flips A off/on); 3 mutations proven to FAIL (ignore DTCNT0 leading delay / DTCNT1 / complementary B). Seam: the complementary path assumes VAL2<VAL3 (normal edge/center-aligned). (PWM_X is now modelled -- 2026-07-25b note above; FRACVAL fractional-delay is the remaining stated seam.) --- output waveform + dangerous-zero reset values (2026-07-24b). (a) The PWM_A output did not EXIST: the output flip-flop (SET at VAL2, reset at VAL3) was unmodelled, so a developer's commanded duty cycle -- the one number motor control is built on -- produced NO observable signal. Now PWM_A(SM0) is generated from the counter vs VAL2/VAL3 with OCTRL[POLA] polarity and OUTEN[PWMA_EN] gating, and a latched fault mapped by DISMAP forces it OFF (the safety cut, now observable). The output pin has no on-chip consumer in emulation, so it is operator-observable via the read-only `pwm-a-output` QOM property (a scope on the pin); the counter is held static at INIT so the compare is deterministic. (b) two catastrophic reset values were memset to zero and uncaught (FlexPWM is not in the reset-values RM golden): DTCNT0/DTCNT1 (dead-time counters) reset to 0x07FF on silicon -- ZERO DEAD-TIME is A direct short ACROSS the DC bus through both transistors of an inverter leg -- DISMAP0 resets to 0xFFFF (every fault disables every output, the safe default), and each SM CTRL resets to 0x0400 (CTRL[FULL], full-cycle reload). The reset-values gate now covers these: its extractor missed the FlexPWM per-submodule register block entirely (the RM names them SM0DTCNT0.. -- struct-array-name + index -- a candidate form the extractor did not emit), so a fix there grew PWM coverage 12 -> 370 registers and surfaced 14 latent reset lies (these + SYSCON DAC clock selectors), all now fixed. Both verified from the RM directly (MCXNP184M150F70RM.pdf reg-summary + 54.5.24: 'Reset sets the deadtime count registers [0x07FF]') and are now the model's reset values, guest-readable. mcxn-flexpwm-output checks 6 output configs (bracket/below/POLA/OUTEN/fault-force/DISMAP-mapping) + the two reset values; seven mutations proven to FAIL the matching axis (ignore compare / POLA / OUTEN / fault-force / DISMAP mapping / DTCNT reset -> 0 / DISMAP reset -> 0). (Dead-time insertion and the complementary PWM_B pair are now modelled too -- see the 2026-07-25 note above; PWM_X output remains a seam.) --- FAULT protection now modelled (2026-07-24): the fault registers were decoded but inert -- a FAULT-pin assertion (the safety path that trips motor gate-drive on silicon) set no FFLAG, mirrored no FFPIN, and raised no interrupt, so a driver's fault handler never ran. Now FAULT0 is operator-driven (the `fault-input` QOM property, same seam as capture-a-input / CMP / PINT): a fault condition (input == FCTRL[FLVL]) latches FSTS[FFLAG], mirrors the live pin in FSTS[FFPIN], and -- gated by FCTRL[FIE] -- raises FLEXPWMn_FAULT (IRQ 113/119). The clear interlock is real: a W1C to FFLAG while the fault is still ASSERTED is refused (a live fault cannot be cleared); FCTRL[FAUTO] auto-clears on return-to-normal. mcxn-flexpwm-fault sweeps three axes, all positive-signal (a SET flag / counted IRQ proves delivery -- no timed absence-check): detection+FIE-gated-IRQ, the clear interlock, and FLVL polarity (holding the input low and toggling only FLVL flips whether that same level is a fault). All four mutation-proven: kill the FFLAG latch / ignore FIE / ignore FLVL / drop the interlock -> the matching axis FAILs. ⚠ seam, STATED: the fault's primary silicon effect -- forcing the mapped PWM outputs to their safe state (FCTRL[FSAFE]/DISMAP) -- is not modelled, because this model has no output-pin/waveform representation at all (OUTEN/MASK are inert bytes); dead-time insertion (DTCNT) is likewise unmodelled. What is proven is the fault detection + STATUS + INTERRUPT path a fault handler binds to. --- Also on this block: the carrier is prescaler-exact + clock-DERIVED (mcxn-pwm), value-register DMA on reload (mcxn-flexpwm-dma), and operator-driven input capture -> eDMA (mcxn-flexpwm-capture)."}
