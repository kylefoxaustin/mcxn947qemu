  - {harness: reset-values, covers: "every register's RESET VALUE vs the REFERENCE MANUAL (1655 registers, 113 instances)", tested_by: [mcxn-reset-values, mcxn-gate-blindspots, mcxn-port-pads], result: pass, note: "⚠ THE GATE HAS TWO STRUCTURAL BLIND SPOTS AND BOTH WERE HIDING REAL BUGS. (1) PER-INSTANCE RESETS: the golden stores ONE reset per register NAME and shares it across instances, so when the RM gives a register two values -- because the value GENUINELY DIFFERS PER INSTANCE -- the extractor sees a contradiction and REFUSES the row. That refusal is CORRECT (a wrong golden makes the CHECKER lie) but A REFUSAL IS NOT A CHECK. Grepping the golden for what the extractor SKIPPED rather than what it checked: the ENTIRE refusal pile was eDMA CH_SBR (16 channels, DMA0=6/DMA1=7, the BUS MASTER ID) -- which Linux READ-MODIFY-WRITES, so it read our ZERO and wrote it back as its own configuration. THE SCHEMA OF YOUR GOLDEN IS A CLAIM ABOUT THE SILICON, and mine claimed a register has one reset value. It does not. Same cause claimed PORTs PCR pads (the SWD pins). (2) MULTIPLEXED WINDOWS: FlexComm decodes by PSELID[PERSEL], which is 0 at reset, so a gate that probes AT RESET reads the LPUART map and the LPI2C registers do not exist to it -- hiding MRDROR/SASR/SRDR/SRDROR all answering ZERO where RXEMPTY should be SET. mcxn-gate-blindspots covers both, hand-read from the RM. ALSO: 168 DUPLICATE golden entries (the RM gives DMA0 and DMA1 their own chapters, so every eDMA register was emitted twice and the CENSUS counted a block as twice as covered as it is -- a census that double-counts is a census that lies). THE ORACLE NOBODY HERE AUTHORED. 59 peripherals reset with memset(regs, 0) -- 59 CLAIMS THAT EVERY RESET VALUE IS ZERO, and the guest believes them. Two of those claims hard-faulted real firmware (SCG SIRCCSR bit 5 -> every FlexComm driver asserted sourceClock_Hz > 0; SCG's 'always valid' -> the SDK reported a crystal frequency for an oscillator nobody turned on). A ZERO RESET VALUE IS NOT THE ABSENCE OF A CLAIM. The golden is the RM's own reset column (checked in as rm-golden.json), read back at the addresses CMSIS gives -- so this gate CANNOT be satisfied by the model agreeing with itself, which is precisely how the LPI2C sub-block sat at the wrong address for months behind a green test that had taken its addresses FROM THE MODEL. 1261 registers now match. 394 KNOWN DEVIATIONS REMAIN AND THE GATE PRINTS THAT NUMBER LOUDLY EVERY RUN: it FAILS on any new mismatch, and it also FAILS when an allowlisted entry starts MATCHING (you must delete the line), because an allowlist that never shrinks stops being a to-do list and becomes a CERTIFICATE. Coverage is a FLOOR, not a ceiling: only registers whose RM row parsed cleanly and that CMSIS attributes to exactly one peripheral are probed"}

# Absent silicon — blocks NOT present on MCXN947.  Chip-accuracy rule (operator):
# absent IP is listed here, NEVER as a failing/negative row in the live matrix.
# Kept as a present-but-empty section for structural diff against the fleet
# (95/93/91): "checked, none" reads differently from an omitted section.
absent: []   # none — MCXN947 is a superset MCU; every block above is present silicon

# Class-axis aliases for cross-fleet diff — blessed by holobench against the
# canonical (validation-standard.md).  Two-axis model: CLASS = how-well-it-WORKS
# (honesty); TIER = how-well-TESTED (depth).  Key clarifications from the
# blessing: "functional" is NOT a class — the golden-verified-vs-merely-
# functional distinction is the TIER axis, so functional maps to COMPUTES with
# tier=B; "not-modelled" must never be able to return wrong-but-clean data
# (silent-wrong) — it is REGISTER-ONLY if a present non-faulting stub, or
# HONEST-FAULT if it visibly errors/rejects.  The reshape that splits the class
# vs tier columns is held until the post-93-upstream freeze lifts.
class_aliases:
  computes: COMPUTES
  functional: COMPUTES                 # + tier=B (driver/functional, no golden oracle)
  operator-driven: COMPUTES-operator-driven
  register-only: REGISTER-ONLY
  honest-fault: HONEST-FAULT
  flag-at-operator: FLAG-AT-OPERATOR (deprecated)
  not-modelled: REGISTER-ONLY|HONEST-FAULT  # per block; never silent-wrong (none on MCX today)
  # Neutron NPU: the errortrap is ON BY DEFAULT.  It used to be OPT-IN, which meant
  # the DEFAULT behaviour was to say NOTHING to the guest -- flag-at-operator, i.e.
  # honest to the operator via QMP and silent to the firmware that actually reads
  # the result.  That is the retired class, and it was the bug.
  neutron-npu-default: HONEST-FAULT    # uncomputed-errortrap -> INTR[ERRORTRAP] + IRQ97

# --- README condensed capability table (second rendering of the SAME blocks) --
# Groups every present block into one condensed "What runs today" row.  Single-
# tier per group; gen-test-matrix.py verify_groups() fails the build if any
# present block is un-grouped, double-grouped, or a group tier disagrees with the
# block's class-derived tier (A = computes/functional, B = the rest).
readme_groups:
  - label: "Dual Cortex-M33 (cpu0 boot + cpu1 release), NVIC/SysTick"
    tier: A
    evidence: "cpu0 releases cpu1 via SYSCON CPUCTRL/CPBOOT; both run (tests/mcxn-dualcore)"
    blocks: [cortex-m33-cpu0, cortex-m33-cpu1, wfi-idle]
  - label: "Inter-core MAILBOX + RPMsg-style shared-memory ring"
    tier: A
    evidence: "Real message data cpu0<->cpu1, byte-exact (tests/mcxn-mailbox, mcxn-rpmsg)"
    blocks: [mailbox]
  - label: "Console + FlexComm (LPUART / LPSPI / LPI2C)"
    tier: A
    evidence: "Zephyr console; SPI/I2C master + board-to-board links (tests/mcxn-flexcomm, mcxn-spi-link, mcxn-uart-link)"
    blocks: [lpuart, lpspi, lpi2c]
  - label: "USB device — USBFS/KHCI + USBHS/ChipIdea, CDC-ACM"
    tier: A
    evidence: "Enumerates on stock Linux cdc_acm -> /dev/ttyACM0, bulk byte-exact (tests/mcxn-usb-cdc)"
    blocks: [usbfs0, usbhs1]
  - label: "Networking — ENET (descriptor-ring MAC)"
    tier: A
    evidence: "Zephyr stack: DHCP lease + TCP echo over a QEMU NIC (tests/mcxn-enet*)"
    blocks: [enet]
  - label: "FlexCAN x2"
    tier: A
    evidence: "Loopback + board-to-board frame round-trip, and a real RX matching process: two FlexCANs on one can-bus, so frames cross the BOARD-TO-BOARD path. A frame lands in the mailbox that FILTERED for it (the bus path used to do no ID matching at all, so a driver trusting its own filter read another node's frame); a frame arriving on an unserviced mailbox OVERWRITES it and sets CODE=OVERRUN per the RM, instead of being dropped in silence; and a controller with MCR[MDIS] set receives nothing. Note the first version of this test used LOOPBACK and mutation testing proved it was DECORATION -- loopback delivery is a separate code path, so it could not catch a single bus-path bug (tests/mcxn-flexcan, mcxn-flexcan-rx, mcxn-can-link)"
    blocks: [flexcan]
  - label: "I3C controller — drives a real I2C bus"
    tier: A
    evidence: "The controller decodes MCTRL (REQUEST/ADDR/DIR/RDTERM) into real i2c_start_transfer/i2c_send/i2c_recv on a bus the SoC exposes. The model supplies the BUS as the silicon does and does NOT invent a device onto it: the test attaches a genuine QEMU at24c EEPROM (-device at24c-eeprom,bus=i2c-bus.0) and the bytes read back BYTE-EXACT — a golden living in a device the I3C model cannot see. An absent target NACKs (MERRWARN) instead of reporting a completed transfer (tests/mcxn-i3c)"
    blocks: [i3c]
  - label: "EMVSIM (smartcard) — registers/IRQs only, NO DATA PATH"
    tier: B
    evidence: "RETRACTED from tier A on 2026-07-12: mutation-testing showed it moves no data (RX_BUF is a stub) and its test asserted only that an interrupt fired, so a corrupted-data mutation could not fail it. Unlike SAI and I3C — which have both since earned tier A back — EMVSIM has NO PEER to talk to: a smartcard interface needs a card, and there is no card model. Registers and IRQs are correct; an honest data path needs an ISO-7816 card, which is roadmap"
    blocks: [emvsim]
  - label: "Storage / XIP — FlexSPI NOR"
    tier: A
    evidence: "FlexSPI drives a real SPI-NOR (LUT/IP commands: WREN + erase + page program, bits only 1->0) with a byte-exact erase -> program -> read-back round trip against a genuine QEMU m25p80 w25q64 — a golden the FlexSPI model does not own. Code runs in place from the same array via the XIP window, which refuses CPU stores (tests/mcxn-flexspi-nor, mcxn-xip)"
    blocks: [flexspi]
  - label: "uSDHC (SD/MMC) — drives a real SD card"
    tier: A
    evidence: "tier A RE-EARNED 2026-07-12. It had been claimed for 'uSDHC ADMA block data' while HAVING NO ADMA AND NO BLOCK DATA: no dma_memory_*, no descriptor walk, no storage — it could not move one byte — and it CONJURED THE CARD (CMD8/CMD3/ACMD41/CMD2 responses invented in CMD_RSP0..3, CINST hardwired so firmware 'detected' a card that was not there). ⭐ AND IT PASSED THE MUTATION AUDIT: the old test did compare values, but CMD8 only 'passed' by the model ECHOING THE TEST'S OWN ARGUMENT (0x1AA in, 0x1AA out) and CMD3 only by the test being told the model's hardcoded RCA — both sides of the comparison came from the same fiction, so the model was its own oracle. Mutation testing proves a test is COUPLED to the model, not that it checks anything REAL; against a conjured peer it is blind by construction. NOW: the model supplies only the BUS and the test attaches a genuine QEMU sd-card, so every response and every byte comes from the card. Real ADMA2 descriptor walk (VALID/END/LINK/TRAN; a bad descriptor raises DMAE), plus SDMA and PIO. The golden is a HOST IMAGE FILE the model cannot reach: the guest reads back a block the host wrote before boot, writes another via ADMA2, and the harness re-checks those bytes IN THE FILE after QEMU exits — so the write really left the emulator. An EMPTY SLOT TIMES OUT (INT_STATUS[CTOE]) and reads CINST=0 instead of the host answering for a card that is not there (tests/mcxn-usdhc)"
    blocks: [usdhc]
  - label: "Timers / PWM — CTIMER, MRT, LPTMR, OSTIMER, SCT, eFlexPWM, RTC"
    tier: A
    evidence: "Timer/PWM data paths + IRQs. The eFlexPWM CARRIER PERIOD is measured against SysTick -- an Arm core timer, independent of every peripheral model -- under -icount so the measurement is deterministic, and SWEPT ACROSS THE PRESCALER (PRSC=0/1/3, i.e. /1 /2 /8). ⭐ THE OLD VERSION OF THIS ROW WAS HALF TRUE AND HID TWO BUGS: (1) CTRL[PRSC] WAS NOT MODELLED AT ALL -- a driver asking for an 8x slower carrier got the same one, silently, and eFlexPWM carrier frequency IS motor control; (2) the counter tick was an INVENTED ~100 MHz appearing nowhere in the RM. Both survived because THE TEST DIVIDED BY THE SAME CONSTANT AS THE MODEL and never set PRSC: SysTick genuinely catches a DRIFTING carrier (that is what it was written for, and it did) but CANNOT catch a wrong TICK RATE or an ignored prescaler -- a careful measurement on one side of a comparison makes the other side INVISIBLE (backend hit the identical shape in a perf/W ratio: THE STALE TERM IS WHICHEVER ONE YOU DID NOT JUST WORK ON). Now: the counter runs from the IPBus clock / 2^PRSC per the RM, the expected SysTick count comes from the RM semantics ((VAL1-INIT+1) << PRSC) and not from the model, and every PRSC must move the carrier by exactly 2^PRSC. Negative-tested BOTH ways: ignore PRSC -> FAIL; restore the old 100 MHz tick -> FAIL (the old test could not catch either). The absolute IPBus rate is NO LONGER an assumption (2026-07-20): the FlexPWM counter is clocked by a real Clock input = the SCG main clock (its IPBus clock is the bus/core clock), so it is DERIVED -- 48 MHz at the FRO_HF reset, 150 MHz once firmware brings up PLL0, and it follows a reconfigure. mcxn-pwm now runs at the RESET clock without configuring the PLL: the PWM counter and SysTick both derive from the main clock, so the (VAL1+1)<<PRSC tick-count golden holds because they SHARE the clock -- pin the PWM to a 150 MHz constant while SysTick sits at 48 MHz and it misses the golden (mutation-proven). The hardcoded PWM_IPBUS_HZ 150 MHz constant is gone (tests/mcxn-pwm, mcxn-ctimer, mcxn-timers, mcxn-ostimer, mcxn-sct, mcxn-rtc, mcxn-coreclk)"
    blocks: [ctimer, mrt, lptmr, ostimer, sct, pwm, rtc]
  - label: "TrustZone-M secure alias — every peripheral, both views"
    tier: A
    evidence: "TrustZone aliases every peripheral non-secure at 0x400x_xxxx and secure at 0x500x_xxxx (+0x1000_0000). The SoC creates 34 such aliases and NOT ONE TEST HAD EVER TOUCHED ANY OF THEM -- the entire suite drove the non-secure view only, so a mis-mapped alias would have left everything green while TrustZone-secure firmware (TF-M / NXP secure boot, the NORMAL case on MCX N) talked to the wrong peripheral or to nothing at all. Found by asking ollama_95_neutron's question -- 'the rigour on one AXIS is the camouflage on the axis you never named' -- of my own tree: I had swept prescalers, filter orders, matrix shapes and access widths, and never once swept the SECURITY ALIAS. Now swept across 8 peripherals: the same identity register must read identically through both views, AND a write through one view must be visible through the other -- the SAME DEVICE, not a copy (a fresh MemoryRegion at the secure base would pass the first check and fail the second). Negative-tested: move the alias base -> FAIL; misplace ONE peripheral's alias -> FAIL (tests/mcxn-secure-alias)"
    blocks: [trustzone-alias]
  - label: "GPIO + eDMA (incl. PERIPHERAL-TRIGGERED DMA)"
    tier: A
    evidence: "GPIO toggles; eDMA TCD transfers, software-triggered AND hardware-request-triggered. CH_CSR[ERQ] was previously a DEAD CONSTANT and no peripheral had a request line, so DMA-driven audio/ADC/UART -- how nearly all real transfer works -- could not run at all. Peripherals now drive one line per CMSIS request-mux source (SAI0 Tx=100), a channel consumes the source its CH_MUX[SRC] selects, one MINOR LOOP per request, and TCD_CSR[DREQ] auto-clears ERQ at major completion. Proven stock-driver-shaped: the CPU arms a channel at the SAI TDR, sets TCSR[FRDE] and NEVER WRITES TDR AGAIN -- every word is carried by the DMA and returns byte-exact through the board loopback. Requests are serviced in a BOTTOM HALF: servicing inline from the peripheral's own MMIO write is a re-entrant access QEMU SILENTLY DROPS, which looks exactly like success (CITER decrements, DONE sets, INTMAJOR fires) while moving ZERO bytes -- negative-tested Proven across request sources that span the mux: SAI0 Tx (=100, byte-exact through the board loopback), DAC0 (=25, operator-probed on the pin), ADC0 FIFO A/B (=21/22, FWMDE-gated), the LPFlexcomm serials (69..88, LPUART/LPSPI/LPI2C EDMA drivers), SINC0 (=103..107, one line per channel, gated by CnCCR[DMAEN], carrying real CIC results to memory in mcxn-sinc-dma with a closed-form OSR^ORD oracle and mutation-proven), FLEXSPI0 (RX=1/TX=2, each gated by IP{RX,TX}FCR[DMAEN]) -- a round trip that TX-DMA page-programs a genuine m25p80 NOR then RX-DMA reads it back byte-exact against a golden the model does not own, mutation-proven in BOTH directions (invert either gate -> clean FAIL, so FLEXSPI_TransferEDMA no longer hangs), and FLEXPWM value-register DMA (the motor-control path: FlexPWM0 Val0=43/FlexPWM1 Val0=51, gated by SM0.DMAEN[VALDE]) -- on each reload the eDMA writes the next duty word into VALx, swept on TWO axes: DATA (VAL3 ends holding the last duty word, carried purely by reload DMA, CPU never wrote it) and RATE (one word per reload, so under -icount the 8-word transfer takes ~8 carrier periods measured against SysTick). Mutation-proven both axes: invert VALDE -> no words move -> FAIL; break the per-reload deassert so the buffer drains in a single reload -> finishes in ~1 period -> the SysTick RATE floor FAILs (so PWM_SetupPwmDMA no longer hangs). And CTIMER MATCH DMA (M0=7+2k/M1=8+2k): a match event drives the request (no CTIMER DMA-enable of its own; INPUTMUX gates it) as a one-shot PULSE. This added a general eDMA edge path -- a FIFO source holds a level the drain loop keys off, but a timer match has no level to lower and no write-back to hook, so the engine auto-acks a pulse after one minor loop and drops an unconsumed pulse at BH end. Stock-driver-shaped (mcxn-ctimer-dma): a flash pattern paced into SRAM one word per match, mutation-proven on DATA and RATE (8 words take >=7 self-calibrated match periods; break the auto-ack -> whole buffer in one match -> FAIL). SCT reuses that same edge path (SCT0 DMA0=19/DMA1=20, gated by DMAREQ0/1[DEV_n] selecting which event drives each request): mcxn-sct-dma paces the same one-word-per-event transfer, mutation-proven on both axes. Remaining: PDM/MICFIL (=18) -- but only because there is no mic bitstream in emulation, so the FIFO is empty and the request could never assert (the gap is the source, not the line); FlexPWM CAPTURE DMA (39-42/47-50) is the same shape, needing an input edge on the PWM pins that has no signal source in emulation. HsCmp/CMP (28-30) is now OPERATOR-DRIVEN through the eDMA edge path (mcxn-cmp-dma): its crossing was already exposed as the comparator-output QOM property, so CCR1[DMA_EN] redirecting an IER-enabled edge to the DMA request just needed wiring -- the operator injects one crossing over QMP and it moves exactly one word, mutation-proven on both axes. PINT (pin interrupt) went from a register stub to FUNCTIONAL to earn its DMA (mcxn-pint-dma): operator-driven pin input (pin-input QOM property) -> edge-detect (RISE/IST) -> PINT0_IRQn=47 -> INT0..3 eDMA (sources 3..6); one injected edge proves DMA/rate/edge/NVIC together, mutation-proven on all three paths. PDM/MICFIL (18) is now operator-fed (mic-input QOM property -> FIFO -> watermark -> level DMA request, drained byte-exact, mutation-proven on data + gate). And FLEXPWM CAPTURE is now closed too (the last input-seam): an operator-driven input-A edge (capture-a-input QOM property) captures the counter into CVAL0 and DMAEN[CA0DE] pulses the request (mcxn-flexpwm-capture), mutation-proven on the capture-DMA and edge-select axes. Every eDMA request source is now wired (tests/mcxn-gpio, mcxn-dma, mcxn-sai-dma, mcxn-dac-dma, mcxn-adc-dma, mcxn-sinc-dma, mcxn-flexspi-dma, mcxn-flexpwm-dma, mcxn-ctimer-dma, mcxn-sct-dma, mcxn-cmp-dma, mcxn-pint-dma, mcxn-pdm-dma)"
    blocks: [gpio, edma]
  - label: "PowerQuad DSP (matrix/vector + CP0 transcendentals)"
    tier: A
    evidence: "Computes real results — matrix/vector ops + scalar sin/cos/ln/divide. SWEPT ACROSS SHAPES: a 2x2*2x2 multiply cannot catch a dimension bug, because LENGTH's three fields (rows of A, cols of A, cols of B) are all equal and swapping any two changes nothing. Non-square 2x3*3x2 and a 1x3*3x1 dot product make every stride distinct. Negative-tested with an output-stride swap that is bit-identical on square matrices: the old test passes it, the sweep catches it (tests/mcxn-powerquad)"
    blocks: [powerquad]
  - label: "Audio — SAI (I2S) + DAC output FIFO"
    tier: A
    evidence: "SAI moves real audio: 8-word TX/RX FIFOs draining at the word rate the firmware programmed, words byte-exact end-to-end over a board-level TXD->RXD jumper, with a real overrun on a full FIFO and underrun on an empty one. DAC drives a real output FIFO — occupancy, FULL/EMPTY/watermark, overflow drops the sample, underflow holds the output, and a level IRQ deasserts on refill (tests/mcxn-sai, mcxn-dac)"
    blocks: [sai, dac]
  - label: "SINC sigma-delta filter (computes)"
    tier: A
    evidence: "Real CIC: the RM's H(z) = ((1-z^-OSR)/(1-z^-1))^ORD decimates a register-fed (PM/SM) modulator bitstream to a 24-bit result. SWEPT ACROSS SHAPES, not stamped at one: an all-ones bitstream must settle to the CIC's DC gain OSR^ORD — a closed-form golden independent of the implementation — at (ORD,OSR) = (1,16) (2,16) (3,8) (2,32) (1,4). Negative-tested with a shape-dependent bug that is correct at ORD=1 and wrong above it: the single-shape check passes it, the sweep catches it (tests/mcxn-sinc)"
    blocks: [sinc]
  - label: "Flash program — FMU (storage-write-verified)"
    tier: A
    evidence: "Byte-exact erase -> program -> read-back round-trip driven through the RM PEWEN/PERDY sequence; flash is a ROM device, so stores outside a program window are refused and cumulative programming fails verify (tests/mcxn-fmu)"
    blocks: [fmu]
  - label: "Security — ELS entropy (TRNG); crypto HONESTLY FAULTED, never faked"
    tier: A
    evidence: "TRNG is real: fresh entropy per read and via RND_REQ DMA, driving Zephyr stack_random (ztest userspace path). The crypto engine (AES/HASH/HMAC/CMAC/ECDSA/ECDH/key-derivation) is NOT implemented and is NOT faked: every such command fails through the engine's own error channel (ELS_STATUS[ELS_ERR] + ELS_ERR_STATUS[OPN_ERR]) and leaves the result buffer untouched, so firmware is told rather than handed uninitialised memory as a signature or key. BUSY still clears, so no driver hangs (tests/mcxn-els)"
    blocks: [els]
  - label: "Watchdogs + micro-tick — WWDT, EWM, UTICK"
    tier: B
    evidence: "Register-accurate; reset/refresh/timeout semantics"
    blocks: [wwdt, ewm, utick]
  - label: "Accelerators (honest) — Neutron NPU, SmartDMA, PowerQuad fixed-point"
    tier: B
    evidence: "Nothing is fabricated and nothing hangs: the Neutron NPU flags its UNCOMPUTED result to the GUEST (INTR[ERRORTRAP] + IRQ 97), SmartDMA leaves CTRL[START] set because its program never ran and no data was moved, and PowerQuad's unmodelled opcodes fail via ERRSTAT[BUSERROR] rather than leaving a stale result. Host-only flags (QMP/log) are NOT sufficient — the firmware under test cannot see them (tests/mcxn-neutron, mcxn-powerquad-coproc)"
    blocks: [neutron-npu, smartdma, powerquad-fixedpt]
  - label: "Analog & audio-in — ADC, CMP, TSI, OPAMP, VREF, PDM"
    tier: B
    evidence: "Register-accurate; analog inputs operator-driven via QOM property. PDM has no bitstream source in emulation and says so: it produces NO samples and flags FIFO underflow rather than fabricating silence firmware cannot tell from real audio"
    blocks: [adc, cmp, tsi, opamp, vref, pdm]
  - label: "INPUTMUX — eDMA request gating (DMAn_REQ_ENABLE)"
    tier: A
    evidence: "Closing a request's gate really BLOCKS the transfer and re-opening it lets it through; an ungated model is MORE PERMISSIVE THAN SILICON, which ships the bug to the board (tests/mcxn-inputmux-gate). Trigger routing (LPTMR/CTIMER -> ADC) is NOT yet modelled"
    blocks: [inputmux]
  - label: "Pin / IRQ / GPIO infra — PORT, PINT, INTM, EVTG, FLEXIO, QDC, PLU"
    tier: B
    evidence: "Drivers bind; pin-mux / IRQ routing registers correct (sub-word MMIO)"
    blocks: [port, pint, intm, evtg, flexio, qdc, plu]
  - label: "CRC engine (computes)"
    tier: A
    evidence: "Verified against three PUBLISHED check vectors over \"123456789\" — CRC-16/CCITT-FALSE 0x29B1, CRC-32/MPEG-2 0x0376E6E7, CRC-32/IEEE 0xCBF43926 — so the goldens are independent of this implementation, and three configurations are swept rather than one stamped (tests/mcxn-crc)"
    blocks: [crc]
  - label: "Memory / cache — CACHE64, NPX, SEMA42, OTPC"
    tier: B
    evidence: "Register-accurate; cache/ID/fuse config"
    blocks: [cache64, npx, sema42, otpc]
  - label: "Clocks / power / system — SCG, SYSCON, SPC, CMC, VBAT, WUU, FREQME, AHBSC"
    tier: B
    evidence: "Clock/power config; firmware programs directly (no System Manager)"
    blocks: [scg, syscon, spc, cmc, vbat, wuu, freqme, ahbsc]
  - label: "Security / crypto / tamper — PKC, PUF, CDOG, GDET, ITRC, TRDC, TDET"
    tier: B
    evidence: "Drivers bind; registers / reset values / W1C semantics correct"
    blocks: [pkc, puf, cdog, gdet, itrc, trdc, tdet]
  - label: "USB charger detection (USBDCD) + PHY / non-core config"
    tier: B
    evidence: "USBDCD runs the real BC1.2 detection SEQUENCE (contact -> primary -> secondary), classifying an operator-driven port (none/SDP/CDP/DCP) with one interrupt per phase -- nothing attached honestly TIMES OUT rather than stamping an 'SDP'. Swept across all four ports and mutation-proven (tests/mcxn-usbdcd). PHY and USBHS non-core remain register-accurate config"
    blocks: [usbdcd, usbphy, usbhs1-usbnc]

# Absent on MCXN947 silicon — N/A rows (authored: the MCU's deltas are not chip
# blocks in the matrix, they are whole subsystems the i.MX AP siblings have).
readme_absent:
  - label: "Cortex-A55 · Linux-capable MMU · apps-processor OS"
    reason: "It's an MCU — real-time, bare-metal / RTOS / Zephyr, no Linux"
  - label: "LCDIF · MIPI-DSI · HDMI bridge · camera ISI/CSI"
    reason: "No display/camera pipeline on this MCU"
  - label: "System Manager (SM/SCMI)"
    reason: "MCU has none; firmware programs SCG/SYSCON clocks directly"
  - label: "Ethos-U65 NPU"
    reason: "The MCX carries the eIQ Neutron NPU instead (flagged, honest)"
  - label: "External DDR controller"
    reason: "On-chip SRAM (512 KiB) + FlexSPI NOR (XIP); no DRAM"
