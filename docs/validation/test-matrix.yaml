gpio_dma_irq:
  - {block: gpio,     present: true, driver_binds: true,  class: functional,    tested_by: [mcxn-gpio], result: pass}
  - {block: port,     present: true, driver_binds: true,  class: register-only, tested_by: [mcxn-gpio, mcxn-mcuxpresso, mcxn-port-pads], result: pass, note: "PAD RESET VALUES ARE PER-PORT, AND WE GAVE ZEROS (fixed 2026-07-13). PORT0s PCR0/PCR3/PCR6 reset to 0x1143/0x1103/0x1103 -- MUX=1 with pulls enabled, i.e. THE SWD DEBUG PINS -- and PORT5s PCR2 to 0x0100. Everything else is zero. The SDKs PORT_SetPinConfig does a READ-MODIFY-WRITE on the pad, so firmware touching a neighbouring field READ A VALUE THE SILICON WOULD NEVER PRODUCE and wrote back a pad configuration that never existed, silently clobbering the debug pins mux and pull. ⚠ AND THE RESET-VALUE GATE STRUCTURALLY CANNOT SEE THIS: it stores ONE reset per (name, offset) and SHARES IT ACROSS INSTANCES, while the RM gives PCR a per-instance value (its summary row says See section for exactly that reason). The extractor CORRECTLY REFUSED the row rather than pick one of the two values -- a missing register is a gap, a WRONG one is a false witness -- but a refusal is not a check, so the refused registers got their own hand-read test (mcxn-port-pads), with the numbers taken from the RM and appearing nowhere in the model. 91emulator found the identical class on their pinmux, where a wrapped table cell had hidden the whole block"}
  - {block: edma,     present: true, driver_binds: true,  class: functional,    tested_by: [mcxn-dma, mcxn-dma-nbytes, mcxn-sai-dma, mcxn-dac-dma, mcxn-uart-dma, mcxn-adc-dma, mcxn-sinc-dma, mcxn-flexspi-dma, mcxn-flexpwm-dma, mcxn-flexpwm-capture, mcxn-ctimer-dma, mcxn-sct-dma, mcxn-cmp-dma, mcxn-pint-dma, mcxn-pdm-dma, mcxn-lpuart-edma-stock, mcxn-edma-stock], result: pass, note: "PERIPHERAL-TRIGGERED DMA added 2026-07-12: CH_CSR[ERQ] used to be a DEAD CONSTANT -- defined, never read -- and no peripheral had a request line, so the only way to move a byte was a software TCD_CSR[START] write. DMA-driven audio/ADC/UART, which is how nearly all real transfer works, DID NOT EXIST: a guest that armed a channel, set ERQ and waited for a FIFO watermark waited forever. Now peripherals drive one GPIO per CMSIS request-mux source (SAI0 Tx=100/Rx=99, DAC0=25, ADC0 FIFO A=21) and a channel consumes the source its CH_MUX[SRC] selects, ONE MINOR LOOP PER REQUEST, with TCD_CSR[DREQ] auto-clearing ERQ at major completion. Verified on TWO different request sources (SAI0 Tx=100 byte-exact through the board loopback; DAC0=25 with the operator probing the analog pin over QMP), so the mux routing is not one-peripheral-specific. Now also the FLEXCOMM block (all 10 LPUART/LPSPI/LPI2C instances, sources 69..88), so LPUART_TransferSendEDMA / LPSPI_MasterTransferEDMA / LPI2C_MasterTransferEDMA work -- LPSPI DER was literally 'accepted, not modelled', i.e. the driver wrote its DMA-enable bit and the model THREW IT AWAY. ADC (21-24) now drives its FIFO-watermark line too, and ADC CALIBRATION was fixed in the same pass: LPADC_DoOffsetCalibration/DoAutoCalibration spin on STAT[CAL_RDY] and GCC[n][RDY], neither of which was modelled -- so ANY firmware using the SDK's standard ADC init HUNG on its first step, while our hand-written ADC test passed the whole time. And SINC (103-107, one line per channel gated by CnCCR[DMAEN]) is now request-driven and stock-driver-tested (mcxn-sinc-dma) -- the one remaining audio/analog block that COMPUTES real data a DMA should carry. And FLEXSPI (RX=1, TX=2, each gated by IP{RX,TX}FCR[DMAEN]) is now request-driven and stock-driver-tested (mcxn-flexspi-dma): a round trip that TX-DMA page-programs a genuine m25p80 NOR then RX-DMA reads it back byte-exact, so FLEXSPI_TransferEDMA no longer hangs -- mutation-proven in BOTH directions (invert either gate -> clean FAIL). And FLEXPWM VALUE-register DMA (the motor-control path): on each SM0 reload, if SM0.DMAEN[VALDE] is set, the FlexPWM raises its value request (FlexPWM0 Val0=43, FlexPWM1 Val0=51) and the eDMA writes the next duty word into VALx -- so PWM_SetupPwmDMA no longer hangs (mcxn-flexpwm-dma). Mutation-proven on TWO axes: invert the VALDE gate -> no words move -> FAIL; break the per-reload deassert so the buffer drains in one reload -> the transfer finishes in ~1 period instead of ~8 -> the SysTick-measured RATE floor FAILs. And CTIMER MATCH DMA (CTIMER{k} M0=7+2k, M1=8+2k): a match event drives the request -- the CTIMER has no DMA-enable of its own, INPUTMUX gates it -- as a one-shot PULSE, one match one minor loop. This needed a new eDMA edge/pulse path: a FIFO source holds a level the drain loop keys off, but a match is an instantaneous event with no level to lower and no write-back to hook, so the engine AUTO-ACKS a pulse source after one minor loop (and drops an unconsumed pulse at BH end -- a latched one would fire spuriously when a channel is later armed). Stock-driver-shaped (mcxn-ctimer-dma): a flash pattern copied into SRAM one word per match, mutation-proven on DATA (buffer byte-exact) and RATE (8 words take >=7 self-calibrated match periods; break the auto-ack -> whole buffer in one match -> FAIL). ⚠ REMAINING (measured, not guessed -- the chip has 117 request sources): MICFIL/PDM (18) -- but PDM has NO bitstream source in emulation, so its FIFO stays empty and the request would never assert anyway (the gap is the missing mic, not the request line); FlexPWM CAPTURE DMA (39-42, 47-50) is the same shape -- a capture request needs an input edge on the PWM pins, which has no signal source in emulation, so the gap is the missing input, not the line; and SCT (SCT0 DMA0=19, DMA1=20) is now request-driven and stock-driver-tested too (mcxn-sct-dma): an SCT event, gated by DMAREQ0/1[DEV_n], paces the same one-word-per-event transfer through the edge path, mutation-proven on DATA (invert the DMAREQ0 gate -> no words move -> FAIL) and RATE (remove the auto-ack -> whole buffer in one event -> FAIL). And HsCmp/CMP (28-30) is now request-driven via the OPERATOR path (mcxn-cmp-dma): its crossing has no analog source in emulation, but it was already operator-driven (the comparator-output QOM property), so CCR1[DMA_EN] redirecting an IER-enabled edge to the DMA request just needed wiring. The operator injects one crossing over QMP; it pulses HsCmp0=28 and moves exactly one word -- mutation-proven on DATA (kill the pulse -> no word -> FAIL) and RATE (remove the auto-ack -> whole buffer on one crossing, out[1] moves and CITER wrong -> FAIL). And PINT (pin interrupt) is now FUNCTIONAL and request-driven (mcxn-pint-dma): it was a register stub (IST/RISE always 0, no IRQ), and building it out earned both the pin-interrupt path and its DMA. The 8 channel input levels are operator-driven (the pin-input QOM property, like the CMP output); a rising edge on an IENR-enabled channel latches RISE+IST, raises PINT0_IRQn=47, and for channels 0..3 pulses the eDMA request (INT0..3 = sources 3..6). One operator-injected edge proves DATA (one word moved), RATE (one per edge), EDGE (RISE/IST latched) and NVIC (the shared handler fires) at once -- mutation-proven on all three code paths (kill the DMA pulse / the IRQ raise / the auto-ack -> FAIL). And PDM/MICFIL (18) is now operator-fed and request-driven (mcxn-pdm-dma): a mic bitstream has no source in emulation, so the mic-input QOM property pushes 24-bit samples into channel 0's FIFO; with CTRL_1[DISEL]=DMA the FIFO watermark asserts the request (a LEVEL, like the SAI -- not the pulse path) and the eDMA drains DATACH0. The harness streams a known sample sequence and the guest demands it byte-exact from memory, carried only by the DMA -- mutation-proven on DATA (zero the captured sample -> FAIL) and on the request gate (invert DISEL==DMA -> no drain -> FAIL). And FLEXPWM CAPTURE (2026-07-21, the LAST input-seam, now closed): the FlexPWM captures its running counter into CVAL0 on an operator-driven input-A edge (capture-a-input QOM property, CAPTCTRLA[ARMA]+EDGA0 select the edge), and DMAEN[CA0DE] pulses the capture request (source 39/47) through the edge path. mcxn-flexpwm-capture is operator-driven: a rising edge captures a counter position and the eDMA moves it to memory; the value is a BOUNDED check (in [INIT,VAL1], not byte-exact -- the operator edge is loosely coupled to the counter phase, said honestly). Mutation-proven on the two load-bearing axes: kill the capture DMA pulse -> no transfer -> FAIL; ignore EDGA0 (capture any edge) -> the negative control's falling edge is wrongly taken -> DONE fires -> FAIL. The control is POSITIVE-SIGNAL (arm rising, need 2 captures, drive fall+rise -> a correct model captures only the rising = 1, CFA0 set + DONE clear), not a delay-loop crutch. Scope: input A / capture circuit 0 / SM0; the ARMA arm-gate is modelled but not swept (disarmed-no-capture has no positive delivery signal). So NO eDMA request seam remains except PDM's missing mic bitstream, which is operator-fed too now -- every request source is wired"}
  - {block: inputmux, present: true, driver_binds: true,  class: functional,    tested_by: [mcxn-inputmux-gate, mcxn-adc-hwtrig, mcxn-reset-values], result: pass, note: "INPUTMUX DOES BOTH OF ITS REAL JOBS NOW (2026-07-12), and it did NEITHER before. (1) TRIGGER ROUTING: LPTMR0 compare -> INPUTMUX -> ADCn_TRIG[0..3] -> ADC hardware trigger. 'Convert on a timer tick' is THE canonical embedded ADC pattern and it was IMPOSSIBLE -- the only way to start a conversion was a CPU write to SWTRIG. The stock lpadc/edma example does exactly this (INPUTMUX_AttachSignal(INPUTMUX0, 0, kINPUTMUX_Lptmr0ToAdc0Trigger); LPTMR_StartTimer) and on this model the timer ticked, THE TRIGGER WENT NOWHERE, and not one conversion ever happened -- nothing logged, nothing faulted, it just sat there. A ROUTER THAT ROUTES NOTHING LOOKS EXACTLY LIKE A ROUTER. Selector 50 = LPTMR0 is DERIVED, not guessed: NXP's compiled driver has kINPUTMUX_Lptmr0ToAdc0Trigger = 0x2800_0032 and AttachSignal does *(base + (conn>>20) + idx*4) = conn & 0xFFFFF, i.e. 'write 50 at offset 0x280'. TCTRL[HTEN] gates it, and mcxn-adc-hwtrig proves BOTH directions: routed-but-unarmed must NOT convert, armed must. (2) DMA REQUEST GATING: see the mcxn-inputmux-gate note. (3) All 57 RM reset values applied -- a selector that resets to 0 is not 'unconfigured', IT NAMES INPUT 0; the real reset 0x7F means NO INPUT CONNECTED. The old model's own comment justified the stub with 'no externally-observable behavior in emulation' -- CIRCULAR: it had none only because nothing was connected to the other end. STILL OPEN: destinations other than the ADCs (DAC/CMP/CTIMER/SCT/FlexPWM triggers) are stored and read back correctly but nothing consumes them yet"}
