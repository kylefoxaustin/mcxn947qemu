clock_power_system:
  - {block: syscon, present: true, driver_binds: true,  class: register-only, tested_by: [boot, corpus, mcxn-dualcore, mcxn-reset-values], result: pass, note: "ALL 64 RM RESET VALUES APPLIED (2026-07-12), and the clock selectors were the worst silent wrong answer of the audit. A CLOCK SELECTOR THAT RESETS TO 0 IS NOT UNCONFIGURED -- IT NAMES A REAL SOURCE, AND THE SDK HANDS OUT ITS FREQUENCY. Every *CLKSEL resets to 7 = NO SOURCE SELECTED and every *CLKDIV resets with bit 30 (HALT) set; we reset them to zero. The SDK reads them: CLOCK_GetCTimerClkFreq() switches on CTIMERCLKSEL and its `case 0U:` returns CLOCK_GetClk1MFreq() -- 1 MHz -- while `default:` (which is what 7 gives) returns 0. Same shape in CLOCK_GetWdtClkFreq and CLOCK_GetOstimerClkFreq (16 kHz) and CLOCK_GetMicfilClkFreq (12 MHz). So a guest that asked for the clock of a CTimer/WDT/OSTIMER/MICFIL IT NEVER CONFIGURED got, on silicon, 0 Hz -- and its driver asserts or bails AND THE DEVELOPER FINDS OUT. On this model it got a PLAUSIBLE, WRONG, NON-ZERO frequency, computed a bogus divider from it, and RAN THE TIMER AT THE WRONG RATE, SILENTLY. That is WORSE than the SCG SIRCCSR bug that started this audit: THAT one hard-faulted, which is LOUD; THIS one returns a confident wrong number. Also CPUCTRL (reset 0x28 = CPU1CLKEN|CPU1RSTEN, i.e. clocked but held in reset): firmware that only does CPUCTRL &= ~CPU1RSTEN, relying on CLKEN being SET OUT OF RESET as it is on silicon, WOULD NEVER HAVE STARTED CPU1 here"}
  - {block: scg,    present: true, driver_binds: true,  class: register-only, tested_by: [boot, corpus, mcxn-scg-clock], result: pass, note: "SCG now matches the RM on ALL 34 probed registers (was 17 mismatches). VALID IS NOW EARNED, NOT FABRICATED: the read path was one line -- `return v | SCG_READY;  /* always valid/locked */` -- for every oscillator and PLL. That is not a conservative simplification, it is a fabricated assertion, and the SDK acts on it: CLOCK_GetExtClkFreq() returns the crystal frequency ONLY IF SOSCCSR[SOSCVLD], so a VLD nobody earned made the SDK report an EXTERNAL CRYSTAL FOR AN OSCILLATOR THAT WAS NEVER TURNED ON. The RM agrees (SOSC/ROSC/APLL/SPLL all reset to 0); SIRC and FIRC really do run out of reset and carry VLD in their RESET VALUE, which is where it belongs. VALID now follows ENABLE, with the enable term taken from WHAT THE DRIVER ACTUALLY SETS BEFORE IT SPINS, not from what the field is named -- ROSC HAS NO ENABLE BIT AT ALL; the SDK sets ROSCCM and waits on ROSCVLD (fsl_clock.c:355). A header is a claim about the silicon; a driver is a claim about what the silicon must DO, and when they disagree the driver wins. Also from the RM: RCCR[SCS]=3 (the source the part actually runs on; CLOCK_GetCoreSysClkFreq switches on it and 0 is a hole, not a source) and xPLL NDIV/MDIV/PDIV=1 (THE SDK DIVIDES BY THESE -- zero was a divide-by-zero sitting in the model). AND THE ONE THAT STARTED THE AUDIT: SIRCCSR reset to 0, but the RM gives it 0100_0020h -- bit 5, SIRC_CLK_PERIPH_EN, is SET OUT OF RESET. CLOCK_GetFro12MFreq() reads that bit and returns 0 Hz when it is clear, so CLOCK_GetLPFlexCommClkFreq() returned 0 and EVERY FlexComm driver init -- LPI2C, LPSPI, LPUART -- tripped assert(sourceClock_Hz > 0U) and HARD-FAULTED. Nothing in the guest's clock_config.c sets the bit BECAUSE ON SILICON IT IS ALREADY SET. A zero reset value is not the absence of a claim; it is a claim, and the guest believes it. Verified two ways: the reset value against the RM, and the stock NXP lpi2c_interrupt example getting through LPI2C_MasterInit -- an oracle I did not write"}
  - {block: spc,    present: true, driver_binds: true,  class: register-only, tested_by: [boot, corpus], result: pass}
  - {block: cmc,    present: true, driver_binds: false, class: register-only, tested_by: [boot, corpus], result: pass}
