# MCXN947 machine-readable test/result matrix — twin of test-result-matrix.md.
# Fleet-convergence schema (95emulator proposal): one row per IP block the chip
# HAS; columns block/present/driver_binds/class/tested_by/result.
# Chip-accuracy rule: absent silicon gets NO row (never a false negative).
# class: computes | functional | operator-driven | register-only |
#        not-modelled
#        (flag-at-operator: DEPRECATED -- it defined "op acked + truth via QMP" as
#         safe, but QMP reaches the OPERATOR, not the guest.  It authorised four
#         real bugs here.  Anything a guest reads must be honest-fault.)
# result is from an actual run; class/driver_binds are human fidelity judgments.

meta:
  chip: MCXN947
  machine: frdm-mcxn947
  generated: "2026-06-29"          # hand-authored; CI-generation is the next step
  suites_total: 40
  suites_pass: 40
  deltas_vs_linux_boards:
    - "no linux-boot rows (M33 MCU, not a Linux AP)"
    - "no in-guest-build rows (cross-build + run-on-core; the run half is the code-sweep)"
    - "adds the operator-driven class (analog inputs injected via QOM)"

cores:
  - {block: cortex-m33-cpu0, present: true,  driver_binds: true, class: functional, tested_by: [mcxn-zephyr, mcxn-ztest, mcxn-mcuxpresso], result: pass}
  - {block: cortex-m33-cpu1, present: true,  driver_binds: true, class: functional, tested_by: [mcxn-dualcore, mcxn-mailbox], result: pass}
  - {block: wfi-idle,        present: true,  driver_binds: true, class: functional, tested_by: [mcxn-idle], result: pass}

connectivity:
  - {block: usbfs0,    present: true, driver_binds: true, class: functional, tested_by: [mcxn-usb], result: pass}
  - {block: usbhs1,    present: true, driver_binds: true, class: functional, tested_by: [mcxn-usb-hs], result: pass}
  - {block: enet,      present: true, driver_binds: true, class: functional, tested_by: [mcxn-enet, mcxn-enet-mac, mcxn-enet-tcp, mcxn-enet-udp, mcxn-enet-tcpip, mcxn-enet-x2, mcxn-enet-lab], result: pass}
  - {block: flexcan,   present: true, driver_binds: true, class: functional, tested_by: [mcxn-flexcan, mcxn-flexcan-rx, mcxn-can-link], result: pass, note: "RX path fixed 2026-07-12: the board-to-board receive path did NO ID MATCHING (a frame landed in the first empty mailbox whatever ID it filtered for, so a driver trusting its own filter read someone else's frame), SILENTLY DROPPED a frame when no mailbox was free (the RM says overwrite and set CODE=OVERRUN — the data moves AND the guest is told), and NEVER CHECKED MCR[MDIS] (a switched-off controller kept receiving). Found by sweeping for gates that can never say no: flexcan_bus_can_receive() returned true unconditionally. ⚠ NAMED GAP, IN THE PERMISSIVE DIRECTION: BIT TIMING IS NOT MODELLED. QEMU's CanBus is MESSAGE-level by design -- frames are exchanged as messages, not bits -- so CTRL1[PRESDIV]/CBT are stored and CANNOT AFFECT DELIVERY. Every node on a QEMU CanBus talks to every other regardless of its configured bitrate. On silicon a mis-computed PRESDIV means the node CANNOT COMMUNICATE AT ALL. So this model is MORE PERMISSIVE THAN THE SILICON: a developer who gets their bit timing wrong passes here and is dead on the board, and QEMU told him he was right. This is a property of QEMU's CAN infrastructure, not of this model, and it is recorded as a DECISION rather than discharged by a flag -- but it is the same class as the ungated eDMA requests, and it is the direction that reaches the customer"}
  - {block: lpuart,    present: true, driver_binds: true, class: functional, tested_by: [mcxn-multiuart, mcxn-flexcomm, mcxn-uart-dma, mcxn-lpuart-edma-stock], result: pass, note: "RESET VALUES from the RM (2026-07-12): BAUD = 0x0F00_0004 (OSR=15 -- THE SDK DIVIDES BY OSR, and 0 is a divide-by-zero waiting for a baud calculation), TOSR = 0xF, DATA[RXEMPT] set when the receiver is empty (reading 0 instead means 'a NUL byte arrived', and a guest polling DATA rather than STAT cannot tell those apart). FIFO[RXFIFOSIZE]/[TXFIFOSIZE] are READ-ONLY CAPABILITY fields (reset 0x22): they were 0 (= the smallest FIFO) AND stored, so the SDK's `base->FIFO = ...` during init would have OVERWRITTEN THE PART'S OWN DESCRIPTION OF ITSELF. A capability register software can change is not a capability register"}
  - {block: lpspi,     present: true, driver_binds: true, class: functional, tested_by: [mcxn-flexcomm, mcxn-spi-link], result: pass, note: "TCR reset = 0x1F (FRAMESZ=31, i.e. a 32-bit frame) from the RM; it was 0, which is a 1-bit frame. RSR[RXEMPTY] was already correct -- the sweep flagged it only because the differential read it at PERSEL=0, where the window decodes as LPUART"}
  - {block: lpi2c,     present: true, driver_binds: true, class: functional, tested_by: [mcxn-flexcomm], result: partial, note: "⚠ THE WHOLE IP WAS AT THE WRONG ADDRESS AND NOBODY NOTICED (fixed 2026-07-12). CMSIS: LP_FLEXCOMM0_BASE = LPUART0_BASE = LPSPI0_BASE = 0x4009_2000, but LPI2C0_BASE = 0x4009_2800 -- the LPI2C sub-block sits at +0x800 in the FlexComm window and the other two do not. The model decoded it at +0x000, so EVERY LPI2C REGISTER ACCESS FROM REAL FIRMWARE (which of course uses LPI2C0_BASE) LANDED IN AN UNMAPPED HOLE AND WAS SILENTLY DROPPED: reads 0, writes on the floor. The IP was UNREACHABLE FROM THE GUEST, and the stock lpi2c examples printed a banner and then did nothing forever because LPI2C_MasterInit()'s every write fell into that hole. AND tests/mcxn-flexcomm PASSED THROUGH ALL OF IT, because it took its addresses FROM THE MODEL: it poked +0x10, the model answered at +0x10, and the two agreed perfectly about a register that is not there on the part. A TEST THAT GETS ITS ADDRESSES FROM THE MODEL IS NOT A TEST, IT IS A MIRROR -- and mutation testing cannot see it, because mutating the model MOVES THE MIRROR TOO. It took an oracle I did not write (the RM's reset values, read back at the addresses CMSIS gives) to notice nobody was home. Also fixed: MSR[TDF] was gated on MEN (RM resets it to 1 with MEN clear -- an empty FIFO has room whether or not you enabled it). STILL PARTIAL: there is no I2C BUS between FlexComm instances, so the on-board master<->slave examples (lpi2c_interrupt, the b2b pair) get through init and then wait for a peer that cannot exist. Slave registers (SCR/SSR/SASR/SRDR at +0x900) are not modelled"}
  - {block: i3c,       present: true, driver_binds: true, class: functional, tested_by: [mcxn-i3c], result: pass, note: "tier A RE-EARNED 2026-07-12: the controller drives a REAL I2C bus (I3C is I2C-compatible in legacy mode). The model supplies the bus as the silicon does and does NOT invent a device onto it; the test attaches a genuine QEMU at24c EEPROM and the bytes read back byte-exact. An absent target NACKs (MERRWARN) instead of reporting a completed transfer"}
  - {block: usdhc,     present: true, driver_binds: true, class: functional, tested_by: [mcxn-usdhc], result: pass, note: "tier A RE-EARNED 2026-07-12: drives a REAL QEMU sd-card on an sd-bus with a real ADMA2 descriptor walk. Golden is a host image file the model cannot reach, re-checked on the host after QEMU exits. An empty slot times out (CTOE) instead of the host answering for an absent card. It previously had NO data path at all and conjured the card's responses — and passed the mutation audit anyway, because the model was its own oracle"}
  - {block: flexspi,   present: true, driver_binds: true, class: functional, tested_by: [mcxn-flexspi, mcxn-flexspi-nor, mcxn-xip, mcxn-qspi-boot], result: pass, note: "QSPI EXECUTE-IN-PLACE BOOT (2026-07-24): `-machine frdm-mcxn947,qspi-boot=on` resets the M33 from the external FlexSPI NOR (secure XIP alias 0x9000_0000) instead of internal flash -- the production boot mode where there is NO internal-flash image. The boot ROM's essential precondition is modelled: a valid FlexSPI Config Block (tag 'FCFB' = 0x42464346 at NOR offset 0x400) must be present or the image is REJECTED, loud and fatal (error_report + exit) -- exactly what a developer whose image lacks the .flexspi_fcb section sees on silicon. mcxn-qspi-boot proves both axes: an FCB-carrying QSPI-linked image boots and RUNS IN PLACE from the NOR (every instruction fetched from 0x9000_0000; prints QSPI-BOOT PASS after computing 1^2+..+10^2=385 in place), and an FCB-less image is rejected. Mutation-proven on BOTH: kill the FCB check -> the FCB-less negative control is no longer rejected -> FAIL; kill the init-svtor reroute (reset from internal flash) -> the QSPI image never boots -> FAIL. ⚠ MODELLED SEAM, STATED: the boot ROM's FlexSPI *configuration* from the FCB lookup-table is not replayed -- the AHB NOR window is a live mirror the CPU fetches from directly, so only the FCB *tag* is validated (the ROM's go/no-go gate), not the LUT/timing fields a real ROM parses to program the FlexSPI controller. The XIP data path itself (LUT-driven NOR reads) is covered by mcxn-xip/mcxn-flexspi-nor."}
  - {block: sai,       present: true, driver_binds: true, class: functional, tested_by: [mcxn-sai], result: pass, note: "THE MCLK IS NOW DERIVED (2026-07-21): the SAI takes a Clock input driven by SYSCON SAI0/1CLKSEL/CLKDIV (CLOCK_GetSaiClkFreq: 1=PLL0, 2=ExtClk, 3=FRO_HF, 4=PLL1/PLL1CLK0DIV), so the audio rate is DERIVED from the source firmware selects and follows a PLL reconfigure -- the old hardcoded 12.288 MHz constant is gone (12.288 is now a real config: PLL1 set to an audio multiple, SAI0CLKSEL=4). No source selected -> 0 Hz -> the SAI has no bit clock and does not clock data. mcxn-sai now proves the DERIVATION, which the MCLK-independent ratio sweep structurally could NOT: it measures the same word config with the SAI clock on FRO_HF (48 MHz) then PLL0 (150 MHz) and the FRO_HF drain takes 150/48 = 3.125x more SysTick ticks (golden from the SDK's source rates, not the model). Mutation-proven: pin the SYSCON SAI mux to a constant -> ratio 1.0 -> FAIL (and both drains hit the timeout, the old hardcode's signature). SAI-dependent tests (sai-dma) now CLOCK_AttachClk(kFRO_HF_to_SAI0) first. --- tier A RE-EARNED 2026-07-12, and the WORD RATE earned separately: the rate claim (TCR2[DIV]/TCR5[W0W]) was in this table for weeks with NOTHING TESTING IT -- mutation testing proved it, making the model ignore TCR2[DIV] left the suite GREEN because the words still moved byte-exact, just at the WRONG RATE, which for an I2S link is the whole point. Now measured against SysTick under -icount and SWEPT ON BOTH AXES (DIV and W0W): sweeping DIV alone was a DEGENERATE SHAPE, since with the word length frozen at 32 bits a model that hardcoded bits=32 is bit-identical -- and that mutation duly survived until W0W was swept too. The check is MCLK-INDEPENDENT by construction (the period scales as BITS*(DIV+1), a ratio in which the nominal MCLK cancels), so it verifies what the RM specifies without leaning on a modelling assumption. Real 8-word TX/RX FIFOs; audio words move byte-exact through a board-level TXD->RXD jumper (loopback property, NOT an invented register bit); overrun on a full FIFO and underrun on an empty one are real"}
  - {block: emvsim,    present: true, driver_binds: true, class: register-only, tested_by: [mcxn-emvsim], result: pass}
  - {block: mailbox,   present: true, driver_binds: true, class: functional, tested_by: [mcxn-mailbox, mcxn-dualcore], result: pass}

timers:
  - {block: ctimer, present: true, driver_binds: true,  class: functional, tested_by: [mcxn-ctimer, mcxn-timers], result: pass, note: "THE CLOCK SELECTOR NOW DECIDES THE RATE (2026-07-12). CTIMER was hardwired to sysclk and IGNORED SYSCON[CTIMERCLKSEL] entirely, behind this line: `return hz ? hz : 150000000;  /* fallback if the clock tree isnt driven */`. Every stock NXP example does CLOCK_AttachClk(kFRO_HF_to_CTIMER0) and then computes its match values from CLOCK_GetCTimerClkFreq() = 48 MHz -- and we ticked the timer at 150 MHz. EVERY CTIMER DELAY WAS 3.1x TOO SHORT, SILENTLY. Measured against SysTick before the fix: 12011 ticks where the SDKs own arithmetic expects 150000. THE FALLBACK WAS THE CAMOUFLAGE, and its own comment announced that the clock tree might not be driven and then made that fact undetectable -- a ?: is not a safety net, it is a place for a bug to live where no test will look. Now: SCG publishes its real sources (fro12m gated by SIRCCSR[SIRC_CLK_PERIPH_EN]; frohf = 0 / 48 / 144 MHz from FIRCCSR[FIRCEN] + FIRCCFG[RANGE], mirroring CLOCK_GetFroHfFreq EXACTLY -- it MUST mirror it, because the GUEST computes its rate from those same registers and programs its timers from the answer), SYSCON muxes them per CTIMERCLKSEL[n] and divides by CTIMERCLKDIV[n], and the CTIMER runs at what it is actually given. PLL0/PLL1 are now DERIVED too (2026-07-19; CTIMERCLKSEL 1=PLL0, 2=PLL1/div -- see the scg row and mcxn-pll-ctimer); the sources we still cannot derive (SAI) report 0 Hz and SAY SO LOUDLY -- a stopped timer is found in an hour; a plausible wrong rate ships. The test now sweeps SELECTOR and DIVIDER with goldens that are RATIOS from the SDKs own source rates (FRO_HF/FRO12M = 4.00x exactly; FRO_HF/4 == FRO12M), so they do not depend on our assumed sysclk at all -- measured 3.99x and 1.00x. The old test counted interrupts and NEVER ATTACHED A CLOCK, something no real firmware does; it could not have caught any of this, because THE INTERRUPTS STILL ARRIVE -- only at the wrong time"}
  - {block: mrt,     present: true, driver_binds: true, class: functional,    tested_by: [mcxn-timers, mcxn-mrt], result: pass, note: "MRT clock is now DERIVED (2026-07-19b): it runs on the AHB/bus clock = the SCG main clock (kCLOCK_Mrt is an AHB_CLK_CTRL1 gate, no selector), so it follows the core -- 48 MHz at the FRO_HF reset, 150 MHz once firmware brings up PLL0 -- instead of the old raw-sysclk 150 MHz constant (and the `?: 150000000` fallback is gone: a bus clock the SCG reports as 0 means the timer does not run, not a plausible 150). mcxn-mrt proves it at the RESET clock without configuring the PLL: MRT and SysTick both derive from the main clock, so 200000 MRT counts == 200000 SysTick ticks whatever that clock is; pin MRT to a 150 MHz constant while SysTick sits at the 48 MHz reset clock and it reads ~64000 -> FAIL."}
  - {block: lptmr,   present: true, driver_binds: true, class: functional,    tested_by: [mcxn-timers, mcxn-lptmr], result: pass, note: "CLOCK SELECTED BY PSR[PCS] (2026-07-21b): the LPTMR ran on the 150 MHz bus clock, IGNORING PSR[PCS] -- but it is a LOW-POWER timer (max 25 MHz), so 150 MHz is impossible on silicon and a driver selecting FRO_12M got a rate 12.5x too fast, silently. RM rev 7 Table 463 gives the source table: 00 FRO_12M (12 MHz, from the SCG) / 01 FRO_16K (16 kHz) / 10 32K_CLK (32.768 kHz) / 11 OSC_SYS (external crystal). FRO_12M is now driven from the SCG fro12m clock; the 16 kHz/32 kHz are fixed low-power oscillators (the same constants SYSCON uses for OSTIMER); OSC_SYS is a board seam (no crystal modelled -> 0 Hz, loud, timer does not run). The 150 MHz fallback is GONE. mcxn-lptmr measures against SysTick (core at a known 150 MHz): FRO_12M is 12.5 SysTick ticks/count (the old 150 MHz gives 1.0 -- caught), and the SAME count at 32K takes 12M/32768 = ~366x longer (a model ignoring PCS reports the same rate -> ratio 1 -- caught). Both mutation-verified."}
  - {block: ostimer, present: true, driver_binds: true,  class: functional, tested_by: [mcxn-ostimer, mcxn-timers], result: pass, note: "THE SELECTOR NOW DECIDES THE RATE -- the first real slice of a CLOCK TREE (2026-07-12). The device DECLARED a Clock input and THE SoC NEVER CONNECTED IT, so this line fired every single time: `return hz ? hz : OSTIMER_HZ;` (1 MHz). THE FALLBACK WAS THE CAMOUFLAGE: the model had exactly the right structure and a default that made the missing wiring invisible, and SYSCON[OSTIMERCLKSEL] -- the register that CHOOSES the rate -- was consumed by NOTHING. A guest selecting the 16 kHz source got a timer running at 1 MHz, SIXTY-TWO TIMES TOO FAST, silently. SYSCON now drives the clock from OSTIMERCLKSEL per the SDK's own switch (0 -> 16000 Hz, 1 -> 32768, 2 -> 1000000, default -> 0 = NO CLOCK, AND 3 IS THE RESET VALUE), and the fallback is GONE: a timer with no clock selected DOES NOT RUN, which is what silicon does. The test now SWEEPS the selector and measures against SysTick; its golden is a RATIO from the SDK's own constants (1000000/16000 = 62.5x), so it does not depend on our assumed sysclk at all -- a model that ignores the selector produces 1.0 and fails. Measured 9375 SysTick ticks per OSTIMER count at 16 kHz = 150 MHz / 16000, exactly. ⚠ The old test never selected a clock AT ALL -- something no real firmware does (the SDK calls CLOCK_AttachClk) -- and the model's default quietly rescued it; when the default was removed THIS TEST WAS THE FIRST THING TO FAIL, which is exactly what should have happened"}
  - {block: sct, present: true, driver_binds: true,  class: functional, tested_by: [mcxn-sct], result: pass, note: "THE SCT NOW RUNS AT THE RATE THE CLOCK TREE GIVES IT (2026-07-13), and it did not before: it was hardwired to a 150 MHz constant while the comment SIX LINES ABOVE that constant said, correctly, `Per the RM the counter is clocked from the SCT clock (SYSCON SCTCLKSEL/SCTCLKDIV)`. IT NAMED THE REGISTER THAT DECIDES THE RATE AND THEN IGNORED IT. Every stock example does CLOCK_AttachClk(kFRO_HF_to_SCT) -- FRO_HF, 48 MHz -- so the SCT was ticking 3.1x TOO FAST. ⭐ AND THE TEST COULD NOT SEE IT BECAUSE THE TEST SHARED THE ASSUMPTION: it predicted SysTick ticks as (MATCHREL+1)*(PRE_L+1), which is only true if the SCT clock EQUALS the CPU clock -- the MODELS constant, not silicons. Model and test were wrong together and it passed. Its own header even claimed `the test must not depend on the absolute frequency, and does not` -- IT DID. A MIRROR THAT DECLARES ITSELF IS STILL A MIRROR, and this one declared itself and then DENIED it in the same paragraph. (rt1180emulator shipped the identical specimen: a PWM golden whose comment read `if PWM_CLK were wrong, this golden would be wrong in exactly the same direction AND STILL PASS`. It was. It did.) The test now PROGRAMS the clock as firmware does and SWEEPS THREE AXES with goldens that are RATIOS from the SDKs own source rates: CTRL[PRE_L] (/1,/2,/8), SYSCON[SCTCLKDIV] (/1,/4), and THE SOURCE ITSELF (FRO_HF 48 -> 144 MHz via FIRCCFG[RANGE], exactly 3x). A model that ignores the clock tree reports THE SAME PERIOD at 48 and 144 MHz and fails. All three mutation-verified. Measured base moved from ~2052 ticks (the old, wrong, 150 MHz) to 6416 (the real 48 MHz) -- the OLD GOLDEN WOULD NOW FAIL, which is what `wrong in the same direction` means"}
  - {block: pwm,     present: true, driver_binds: true, class: functional,    tested_by: [mcxn-pwm, mcxn-flexpwm-dma, mcxn-flexpwm-capture, mcxn-flexpwm-fault], result: pass, note: "FAULT PROTECTION now modelled (2026-07-24): the fault registers were decoded but INERT -- a FAULT-pin assertion (the safety path that trips motor gate-drive on silicon) set no FFLAG, mirrored no FFPIN, and raised no interrupt, so a driver's fault handler never ran. Now FAULT0 is operator-driven (the `fault-input` QOM property, same seam as capture-a-input / CMP / PINT): a fault condition (input == FCTRL[FLVL]) latches FSTS[FFLAG], mirrors the live pin in FSTS[FFPIN], and -- gated by FCTRL[FIE] -- raises FLEXPWMn_FAULT (IRQ 113/119). The clear INTERLOCK is real: a W1C to FFLAG while the fault is STILL ASSERTED is refused (a live fault cannot be cleared); FCTRL[FAUTO] auto-clears on return-to-normal. mcxn-flexpwm-fault sweeps THREE axes, all positive-signal (a SET flag / counted IRQ proves delivery -- no timed absence-check): detection+FIE-gated-IRQ, the clear interlock, and FLVL polarity (holding the input LOW and toggling only FLVL flips whether that same level is a fault). All four mutation-proven: kill the FFLAG latch / ignore FIE / ignore FLVL / drop the interlock -> the matching axis FAILs. ⚠ SEAM, STATED: the fault's PRIMARY silicon effect -- FORCING THE MAPPED PWM OUTPUTS to their safe state (FCTRL[FSAFE]/DISMAP) -- is NOT modelled, because this model has no output-pin/waveform representation at all (OUTEN/MASK are inert bytes); dead-time insertion (DTCNT) is likewise unmodelled. What is proven is the fault DETECTION + STATUS + INTERRUPT path a fault handler binds to. --- Also on this block: the carrier is prescaler-exact + clock-DERIVED (mcxn-pwm), value-register DMA on reload (mcxn-flexpwm-dma), and operator-driven input capture -> eDMA (mcxn-flexpwm-capture)."}
  - {block: rtc,     present: true, driver_binds: true, class: functional,    tested_by: [mcxn-rtc], result: pass}
  - {block: utick,   present: true, driver_binds: false, class: register-only, tested_by: [boot, corpus], result: pass}
  - {block: wwdt,    present: true, driver_binds: false, class: register-only, tested_by: [boot, corpus], result: pass}
  - {block: ewm,     present: true, driver_binds: false, class: register-only, tested_by: [boot, corpus], result: pass}

compute:
  - {block: powerquad,        present: true, driver_binds: true,  class: computes,         tested_by: [mcxn-powerquad, mcxn-powerquad-coproc], result: pass}
  - {block: powerquad-fixedpt, present: true, driver_binds: true, class: honest-fault, tested_by: [mcxn-powerquad-coproc], result: pass, note: "unmodelled CP_MTX opcodes (INV/PROD, FFT/FIR) now FAIL to the guest via ERRSTAT[BUSERROR] instead of leaving a stale result buffer the guest would read as an answer"}
  - {block: smartdma,         present: true, driver_binds: false, class: honest-fault, tested_by: [boot, corpus], result: pass, note: "the EZH core is not modelled, so the program never runs and NOTHING IS MOVED. CTRL[START] therefore stays SET (a dead coprocessor) instead of self-clearing, which used to tell a polling guest its transfer had completed while the destination buffer was untouched"}
  - {block: neutron-npu,      present: true, driver_binds: true,  class: honest-fault, tested_by: [mcxn-neutron], result: pass, note: "compute is proprietary microcode (RM: no user registers). The handshake is acked so firmware never hangs, and the UNCOMPUTED result is surfaced TO THE GUEST by default via the non-gating INTR[ERRORTRAP] + IRQ 97 — not merely to the host via QMP, which the firmware under test cannot see"}

analog:
  - {block: adc,   present: true, driver_binds: true,  class: operator-driven, tested_by: [mcxn-adc, mcxn-adc-dma, mcxn-adc-fifo, mcxn-adc-hwtrig], result: pass, note: "HARDWARE TRIGGERS WORK NOW: TCTRLn can be driven by INPUTMUX from an LPTMR compare (TCTRL[HTEN] gates it), so 'convert on a timer tick' -- the most common thing an ADC is ever asked to do -- is finally possible. It was not: the ONLY way to start a conversion was a CPU write to SWTRIG, and the stock lpadc/edma example sat there forever. ALSO: THE RESULT FIFO IS NOW A REAL FIFO (fixed 2026-07-12). It was `uint32_t fifo_data; bool fifo_valid;` -- A SINGLE SLOT -- so a conversion arriving before the previous one was drained SILENTLY OVERWROTE IT: no flag, no error, a conversion simply ceased to exist. Silicon has a 16-word FIFO and raises STAT[FOFn] on overflow, dropping the NEW result and keeping the old (RM: 'The newer data is not stored'). And depth 1 did not merely mean less buffering -- IT SILENTLY DISABLED THE FEATURE BUILT ON IT: FCTRL[FWMARK] is a watermark, occupancy could only ever be 0 or 1, so any firmware asking to be woken at FWMARK >= 1 ('tell me when 8 samples are ready', the entire point of the register) WAITED FOREVER. The previous note here claimed 'DMA capture works (FIFO watermark -> request 21)'; the request line worked, THE WATERMARK NEVER DID. Now: depth 16, FCOUNT, FWMARK-gated RDY, FOF overflow, both FIFOs, TCTRL[FIFO_SEL_A] routing. HOW IT WAS CAUGHT: not by a failing test but by a FLAKY one -- mcxn-adc-dma passed ~1 run in 3, and I had once 'fixed' it by adding a DELAY LOOP to the firmware so the eDMA could drain the single slot between triggers. That crutch WAS the camouflage. Re-running under -icount (a deterministic instrument) turned the coin flip into a reproducible FAIL and the missing samples were then obvious. A FLAKY TEST IS NOT A TEST THAT SOMETIMES FAILS; IT IS A BUG YOU HAVE AGREED TO SEE ONLY SOMETIMES. And CALIBRATION completes: the stock LPADC driver spins on STAT[CAL_RDY] and GCC[n][RDY], neither modelled, so the SDK's standard ADC init HUNG FOREVER on its first step. GCC gain-cal reads 0 = UNITY GAIN, which is the honest value -- inventing a trim would make the guest correct for a distortion that does not exist. ⚠ Hardware trigger routing (INPUTMUX: LPTMR/CTIMER -> ADC) is NOT modelled, so the stock lpadc/edma example, which triggers from LPTMR0, still cannot convert"}
  - {block: cmp,   present: true, driver_binds: true,  class: operator-driven, tested_by: [mcxn-cmp], result: pass}
  - {block: tsi,   present: true, driver_binds: true,  class: operator-driven, tested_by: [mcxn-tsi], result: pass}
  - {block: dac,   present: true, driver_binds: true,  class: functional,      tested_by: [mcxn-dac, mcxn-dac-dma], result: pass, note: "DMA-driven streaming works: the FIFO watermark drives eDMA request source 25 and the CPU never writes DATA. The converted waveform is read back byte-exact by the OPERATOR probing the analog-output pin over QMP -- a DAC's answer only exists on the pin"}
  - {block: opamp, present: true, driver_binds: false, class: register-only,   tested_by: [boot, corpus], result: pass}
