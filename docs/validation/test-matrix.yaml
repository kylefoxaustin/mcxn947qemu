clock_power_system:
  - {block: syscon, present: true, driver_binds: true,  class: register-only, tested_by: [boot, corpus, mcxn-dualcore, mcxn-reset-values, mcxn-ahbclkdiv], result: pass, note: "AHB BUSCLK DERIVED (2026-07-22): SYSCON now computes the AHB/bus clock = SCG mainclk / (AHBCLKDIV+1) and drives the M33 core+SysTick, MRT and PWM from it (they took mainclk directly = /1 before). This required realizing SYSCON BEFORE the cores (so its busclk feeds cpuclk) while the cpu1 handover is still set AFTER the cores realize -- resolved by making cpu1 a direct field set (s->syscon.cpu1 = armv7m[1].cpu) instead of a DEFINE_PROP_LINK (which must be set pre-realize), breaking the busclk<->cpu1 ordering cycle; SYSCON reads cpu1 only at runtime on the CPUCTRL write, never at realize. mcxn-ahbclkdiv proves it against a CTIMER-on-FRO12M reference (independent of the AHB clock): at AHBCLKDIV=/2 the same interval costs HALF the SysTick ticks (the SysTick clock halved), ratio 0.5 vs 1.0-if-ignored; mutation-proven. Dual-core boot + Zephyr regression-clean through the reorder. --- ALL 64 RM RESET VALUES APPLIED (2026-07-12), and the clock selectors were the worst silent wrong answer of the audit. A CLOCK SELECTOR THAT RESETS TO 0 IS NOT UNCONFIGURED -- IT NAMES A REAL SOURCE, AND THE SDK HANDS OUT ITS FREQUENCY. Every *CLKSEL resets to 7 = NO SOURCE SELECTED and every *CLKDIV resets with bit 30 (HALT) set; we reset them to zero. The SDK reads them: CLOCK_GetCTimerClkFreq() switches on CTIMERCLKSEL and its `case 0U:` returns CLOCK_GetClk1MFreq() -- 1 MHz -- while `default:` (which is what 7 gives) returns 0. Same shape in CLOCK_GetWdtClkFreq and CLOCK_GetOstimerClkFreq (16 kHz) and CLOCK_GetMicfilClkFreq (12 MHz). So a guest that asked for the clock of a CTimer/WDT/OSTIMER/MICFIL IT NEVER CONFIGURED got, on silicon, 0 Hz -- and its driver asserts or bails AND THE DEVELOPER FINDS OUT. On this model it got a PLAUSIBLE, WRONG, NON-ZERO frequency, computed a bogus divider from it, and RAN THE TIMER AT THE WRONG RATE, SILENTLY. That is WORSE than the SCG SIRCCSR bug that started this audit: THAT one hard-faulted, which is LOUD; THIS one returns a confident wrong number. Also CPUCTRL (reset 0x28 = CPU1CLKEN|CPU1RSTEN, i.e. clocked but held in reset): firmware that only does CPUCTRL &= ~CPU1RSTEN, relying on CLKEN being SET OUT OF RESET as it is on silicon, WOULD NEVER HAVE STARTED CPU1 here"}
  - {block: scg,    present: true, driver_binds: true,  class: register-only, tested_by: [boot, corpus, mcxn-scg-clock, mcxn-pll-ctimer, mcxn-coreclk], result: pass, note: "THE M33 CORE CLOCK IS NOW DERIVED (2026-07-19b): the SCG main clock (RCCR[SCS] -> source; FRO_HF at reset -> 48 MHz, PLL0 after firmware -> 150 MHz) feeds the M33 cpuclk/refclk, so an un-configured core boots at the REAL 48 MHz reset rate (RCCR resets SCS=3 = FRO_HF, rm-golden 0x0300_0000; FIRC is on at reset -- RM-derived: the boot clock can't be a dead oscillator, and the SDK explicitly DISABLES FIRCEN for its FRO12M profile, i.e. you disable what's on) and rises to 150 MHz once firmware brings up PLL0. mcxn-coreclk proves it against an independent MRT reference: the same real-time interval costs 150/48 = 3.125x more SysTick ticks after the PLL is configured, because SysTick's clock MOVED (64004 -> 200012); mutation-proven (pin the core to a 150 MHz constant -> reset-vs-configured invisible -> FAIL). ⚠ CONSEQUENCE: a timing test that measures absolute time vs SysTick must configure the clock first (the clock_init_150m preamble, = BOARD_InitBootClocks), else it reads the 48 MHz reset clock -- 5 tests updated (pwm/mrt/sct/flexpwm-dma/pll-ctimer). The 'boot pre-configured to 150 MHz' shortcut is blocked by the reset-values gate (correctly refusing non-RM SCG reset values). --- PLL0/PLL1 ARE ALSO DERIVED (2026-07-19a), not 0-Hz stubs: the SCG computes each PLL's output from its own APLL/SPLL NDIV/MDIV/PDIV registers via the RM formula (fsl_clock.c CLOCK_GetPll0OutFreq: Fout = (Fin/N)*M/postdiv, source per CTRL[SOURCE]), exposes them as clock outputs, and SYSCON muxes them to the CTIMER (selector 1=PLL0, 2=PLL1/PLL1CLK0DIV) and SCT (1=PLL0, 4=PLL1/div). Proven end-to-end (mcxn-pll-ctimer): program PLL0=150 MHz from the 48 MHz FIRC (N=8,M=50,P=1), point CTIMER0 at it, time an interval against SysTick, HALVE the multiplier (M 50->25 => 75 MHz) and the CTIMER interval DOUBLES -- the timer follows the PLL. Mutation-proven both links: SCG ignores MDIV -> reconfigure invisible -> FAIL; SYSCON selector-1 reads FRO_HF not PLL0 -> wrong rate -> FAIL. ⚠ The M33 core clock / SysTick still ride the board's 150 MHz sysclk constant (RCCR[SCS] not yet fed to the core); the reset-values gate blocks faking a configured SCG at reset, so that is a later honest-reset-clock phase. --- SCG now matches the RM on ALL 34 probed registers (was 17 mismatches). VALID IS NOW EARNED, NOT FABRICATED: the read path was one line -- `return v | SCG_READY;  /* always valid/locked */` -- for every oscillator and PLL. That is not a conservative simplification, it is a fabricated assertion, and the SDK acts on it: CLOCK_GetExtClkFreq() returns the crystal frequency ONLY IF SOSCCSR[SOSCVLD], so a VLD nobody earned made the SDK report an EXTERNAL CRYSTAL FOR AN OSCILLATOR THAT WAS NEVER TURNED ON. The RM agrees (SOSC/ROSC/APLL/SPLL all reset to 0); SIRC and FIRC really do run out of reset and carry VLD in their RESET VALUE, which is where it belongs. VALID now follows ENABLE, with the enable term taken from WHAT THE DRIVER ACTUALLY SETS BEFORE IT SPINS, not from what the field is named -- ROSC HAS NO ENABLE BIT AT ALL; the SDK sets ROSCCM and waits on ROSCVLD (fsl_clock.c:355). A header is a claim about the silicon; a driver is a claim about what the silicon must DO, and when they disagree the driver wins. Also from the RM: RCCR[SCS]=3 (the source the part actually runs on; CLOCK_GetCoreSysClkFreq switches on it and 0 is a hole, not a source) and xPLL NDIV/MDIV/PDIV=1 (THE SDK DIVIDES BY THESE -- zero was a divide-by-zero sitting in the model). AND THE ONE THAT STARTED THE AUDIT: SIRCCSR reset to 0, but the RM gives it 0100_0020h -- bit 5, SIRC_CLK_PERIPH_EN, is SET OUT OF RESET. CLOCK_GetFro12MFreq() reads that bit and returns 0 Hz when it is clear, so CLOCK_GetLPFlexCommClkFreq() returned 0 and EVERY FlexComm driver init -- LPI2C, LPSPI, LPUART -- tripped assert(sourceClock_Hz > 0U) and HARD-FAULTED. Nothing in the guest's clock_config.c sets the bit BECAUSE ON SILICON IT IS ALREADY SET. A zero reset value is not the absence of a claim; it is a claim, and the guest believes it. Verified two ways: the reset value against the RM, and the stock NXP lpi2c_interrupt example getting through LPI2C_MasterInit -- an oracle I did not write"}
