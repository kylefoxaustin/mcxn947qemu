analog:
  - {block: adc,   present: true, driver_binds: true,  class: operator-driven, tested_by: [mcxn-adc, mcxn-adc-dma, mcxn-adc-fifo, mcxn-adc-hwtrig, mcxn-adc-ctimer-trig, mcxn-adc-ctimer-adc1-trig, mcxn-adc-pwm-trig], result: pass, note: "hardware triggers work now: TCTRLn can be driven by INPUTMUX from an LPTMR compare (mcxn-adc-hwtrig), a CTIMER match (mcxn-adc-ctimer-trig), or a FlexPWM submodule output trigger (mcxn-adc-pwm-trig, the motor-control synchronous-sampling path), TCTRL[HTEN] gating all, so 'convert on a timer tick/match/PWM-compare' -- the most common thing an ADC is ever asked to do -- is finally possible. It was not: the only way to start a conversion was a CPU write to SWTRIG, and the stock lpadc/edma example sat there forever. also: the result FIFO is now A real FIFO (fixed 2026-07-12). It was `uint32_t fifo_data; bool fifo_valid;` -- A single slot -- so a conversion arriving before the previous one was drained silently overwrote it: no flag, no error, a conversion simply ceased to exist. Silicon has a 16-word FIFO and raises STAT[FOFn] on overflow, dropping the new result and keeping the old (RM: 'The newer data is not stored'). And depth 1 did not merely mean less buffering -- it silently disabled the feature built on it: FCTRL[FWMARK] is a watermark, occupancy could only ever be 0 or 1, so any firmware asking to be woken at FWMARK >= 1 ('tell me when 8 samples are ready', the entire point of the register) waited forever. The previous note here claimed 'DMA capture works (FIFO watermark -> request 21)'; the request line worked, the watermark never did. Now: depth 16, FCOUNT, FWMARK-gated RDY, FOF overflow, both FIFOs, TCTRL[FIFO_SEL_A] routing. how it was caught: not by a failing test but by a FLAKY one -- mcxn-adc-dma passed ~1 run in 3, and I had once 'fixed' it by adding a delay loop to the firmware so the eDMA could drain the single slot between triggers. That crutch was the camouflage. Re-running under -icount (a deterministic instrument) turned the coin flip into a reproducible FAIL and the missing samples were then obvious. A FLAKY TEST is not A TEST that sometimes FAILS; it is A bug you have AGREED to see only sometimes. And calibration completes: the stock LPADC driver spins on STAT[CAL_RDY] and GCC[n][RDY], neither modelled, so the SDK's standard ADC init hung forever on its first step. GCC gain-cal reads 0 = unity gain, which is the honest value -- inventing a trim would make the guest correct for a distortion that does not exist. Hardware trigger routing (INPUTMUX: LPTMR, CTIMER0/1/2-M3, CTIMER3/4-M2/M1-to-ADC1, and FlexPWM0/1 SM0 output triggers -> ADC) is modelled now, so the stock lpadc/edma example and the motor-control PWM-synchronised sampling loop both convert; the per-destination CTIMER3/4 selector divergence (ADC0=M3 vs ADC1=M2/M1) is modelled and mutation-proven (see the inputmux note; FlexPWM-TRGFRQ remains the one stated boundary)"}
  - {block: cmp,   present: true, driver_binds: true,  class: operator-driven, tested_by: [mcxn-cmp, mcxn-cmp-dma, mcxn-cmp-trig], result: pass, note: "The comparator output is operator-driven (comparator-output QOM property -- no analog stimulus in QEMU); a crossing latches CSR[CFR]/CFF and raises the IRQ, or (CCR1[DMA_EN]) an eDMA request (mcxn-cmp-dma). round-robin hardware trigger (2026-07-29): a timer routed through INPUTMUX CMPn_TRIG paces the comparator's round-robin sampling -- the low-power 'monitor a signal, wake on deviation' path, CPU-free. It was inert: CMPn_TRIG reached nothing and CSR[RRF] could never set. Enabling round-robin captures a baseline (RR_INITMOD); each external-triggered sample that deviates from it latches CSR[RRF] and, gated by IER[RRF_IE], raises the IRQ. RRCR0[RR_TRG_SEL] gates the source (0=external/1=internal timer). mcxn-cmp-trig drives CTIMER0 M3 -> CMP0 and, over QMP, holds the output at baseline (RRF stays clear), then drives it high (deviation -> RRF sets), then selects internal mode (external trigger ignored -> RRF stays clear); mutation-proven (sever the INPUTMUX->CMP pulse -> no RRF -> FAIL; drop the RR_TRG_SEL gate -> the external trigger samples in internal mode -> FAIL). ⚠ Scope: channel 0, deviation-from-baseline; the multi-channel sweep (RRCR1 RR_CHnEN/FIXCH/FIXP), the per-channel RRCSR fan-out and the internal RR timer (RRCR2) are a stated boundary -- the single-channel monitor the trigger path needs, not the full round-robin"}
  - {block: tsi,   present: true, driver_binds: true,  class: operator-driven, tested_by: [mcxn-tsi, mcxn-tsi-trig], result: pass, note: "Operator-driven per-channel scan count (tsi-countN QOM), software-trigger scan (GENCS[SWTS]) -> DATA[EOSF] + operator count -> IRQ 101. hardware-trigger SCAN (2026-07-30): an LPTMR routed through INPUTMUX TSI_TRIG paces the touch scan -- the low-power 'wake the TSI off a timer' path, the touch counterpart of the ADC's convert-on-a-timer. It was inert: TSI_TRIG reached nothing, and GENCS[STM] (hardware-trigger mode) merely fabricated one scan the instant it was written, with no trigger source behind it. Now STM only selects the source (0=SWTS, 1=hardware) and a routed LPTMR edge drives the scan in hardware mode. Per-destination selector (TSI: LPTMR0=0/LPTMR1=1, vs the ADC's 50/51 -- the router remaps). mcxn-tsi-trig: LPTMR0 -> TSI0, software mode ignores the trigger, hardware mode paces a scan (EOSF + TSICNT); mutation-proven (sever the INPUTMUX->TSI pulse -> no scan -> FAIL; drop the STM gate -> the trigger scans in software mode -> FAIL). Electrode capacitance (the scan count source) remains the operator seam"}
  - {block: dac,   present: true, driver_binds: true,  class: functional,      tested_by: [mcxn-dac, mcxn-dac-dma, mcxn-dac-hwtrig], result: pass, note: "DMA-driven streaming works: the FIFO watermark drives eDMA request source 25 and the CPU never writes DATA. The converted waveform is read back byte-exact by the operator probing the analog-output pin over QMP -- a DAC's answer only exists on the pin. hardware trigger (2026-07-29): a timer/PWM routed through INPUTMUX DACn_TRIG advances the output FIFO one sample per trigger (fsl_dac external-trigger waveform generation, zero CPU per sample) -- it was impossible, DACn_TRIG reached nothing and the DAC only advanced on TCR[SWTRG]. GCR[TRGSEL] gates it: hardware trigger acts in hardware mode (TRGSEL=0), is ignored in software mode (TRGSEL=1). mcxn-dac-hwtrig drives CTIMER0 M3 -> DAC0 and watches FPR/FSR from the guest: software mode leaves the read pointer put, hardware mode drains the FIFO to EMPTY + underflows; mutation-proven (sever the INPUTMUX->DAC pulse -> no drain -> FAIL; drop the TRGSEL gate -> the trigger advances in software mode -> FAIL). Stated: SWTRG in hardware mode is left ungated (pre-existing)"}
  - {block: opamp, present: true, driver_binds: false, class: register-only,   tested_by: [boot, corpus], result: pass}
  - {block: vref,  present: true, driver_binds: false, class: register-only,   tested_by: [boot, corpus], result: pass}
  - {block: pdm,   present: true, driver_binds: false, class: register-only,   tested_by: [boot, corpus], result: pass}
  - {block: sinc,  present: true, driver_binds: true,  class: functional,      tested_by: [mcxn-sinc, mcxn-sinc-dma], result: pass, note: "DMA path added: each channel drives its eDMA request line (CMSIS SINC0 ipd_req_sinc[n] = 103+n) when its FIFO passes the watermark and CnCCR[DMAEN] is set. Before this, DMAEN drove nothing -- a DMA-armed SINC driver (SINC_TransferReceiveEDMA shape) waited forever for a request that could not be raised, so the results the filter genuinely computed never moved. mcxn-sinc-dma is stock-driver-shaped (the CPU arms eDMA at CnRDATA, sets DMAEN, and never reads CnRDATA again) with a closed-form oracle independent of the DMA path (all-ones bitstream -> CIC DC gain OSR^ORD = 16). Mutation-proven: invert the DMAEN gate so the request never fires -> the DMA moves nothing and the test FAILS"}


gpio_dma_irq:
  - {block: gpio,     present: true, driver_binds: true,  class: functional,    tested_by: [mcxn-gpio], result: pass}
  - {block: port,     present: true, driver_binds: true,  class: register-only, tested_by: [mcxn-gpio, mcxn-mcuxpresso, mcxn-port-pads], result: pass, note: "pad reset values are per-port, and we gave ZEROS (fixed 2026-07-13). PORT0s PCR0/PCR3/PCR6 reset to 0x1143/0x1103/0x1103 -- MUX=1 with pulls enabled, i.e. the SWD debug pins -- and PORT5s PCR2 to 0x0100. Everything else is zero. The SDKs PORT_SetPinConfig does a read-modify-write on the pad, so firmware touching a neighbouring field READ A value the silicon would never produce and wrote back a pad configuration that never existed, silently clobbering the debug pins mux and pull. ⚠ and the reset-value gate structurally cannot see this: it stores one reset per (name, offset) and shares it ACROSS instances, while the RM gives PCR a per-instance value (its summary row says See section for exactly that reason). The extractor correctly refused the row rather than pick one of the two values -- a missing register is a gap, a wrong one is a false witness -- but a refusal is not a check, so the refused registers got their own hand-read test (mcxn-port-pads), with the numbers taken from the RM and appearing nowhere in the model. 91emulator found the identical class on their pinmux, where a wrapped table cell had hidden the whole block"}
  - {block: edma,     present: true, driver_binds: true,  class: functional,    tested_by: [mcxn-dma, mcxn-dma-nbytes, mcxn-sai-dma, mcxn-dac-dma, mcxn-uart-dma, mcxn-adc-dma, mcxn-sinc-dma, mcxn-flexspi-dma, mcxn-flexpwm-dma, mcxn-flexpwm-capture, mcxn-ctimer-dma, mcxn-sct-dma, mcxn-cmp-dma, mcxn-pint-dma, mcxn-pdm-dma, mcxn-lpuart-edma-stock, mcxn-edma-stock], result: pass, note: "peripheral-triggered DMA added 2026-07-12: CH_CSR[ERQ] used to be a dead constant -- defined, never read -- and no peripheral had a request line, so the only way to move a byte was a software TCD_CSR[START] write. DMA-driven audio/ADC/UART, which is how nearly all real transfer works, did not EXIST: a guest that armed a channel, set ERQ and waited for a FIFO watermark waited forever. Now peripherals drive one GPIO per CMSIS request-mux source (SAI0 Tx=100/Rx=99, DAC0=25, ADC0 FIFO A=21) and a channel consumes the source its CH_MUX[SRC] selects, one minor loop PER REQUEST, with TCD_CSR[DREQ] auto-clearing ERQ at major completion. Verified on two different request sources (SAI0 Tx=100 byte-exact through the board loopback; DAC0=25 with the operator probing the analog pin over QMP), so the mux routing is not one-peripheral-specific. Now also the FLEXCOMM block (all 10 LPUART/LPSPI/LPI2C instances, sources 69..88), so LPUART_TransferSendEDMA / LPSPI_MasterTransferEDMA / LPI2C_MasterTransferEDMA work -- LPSPI DER was literally 'accepted, not modelled', i.e. the driver wrote its DMA-enable bit and the model threw it away. ADC (21-24) now drives its FIFO-watermark line too, and ADC calibration was fixed in the same pass: LPADC_DoOffsetCalibration/DoAutoCalibration spin on STAT[CAL_RDY] and GCC[n][RDY], neither of which was modelled -- so any firmware using the SDK's standard ADC init hung on its first step, while our hand-written ADC test passed the whole time. And SINC (103-107, one line per channel gated by CnCCR[DMAEN]) is now request-driven and stock-driver-tested (mcxn-sinc-dma) -- the one remaining audio/analog block that computes real data a DMA should carry. And FLEXSPI (RX=1, TX=2, each gated by IP{RX,TX}FCR[DMAEN]) is now request-driven and stock-driver-tested (mcxn-flexspi-dma): a round trip that TX-DMA page-programs a genuine m25p80 NOR then RX-DMA reads it back byte-exact, so FLEXSPI_TransferEDMA no longer hangs -- mutation-proven in both directions (invert either gate -> clean FAIL). And FLEXPWM VALUE-register DMA (the motor-control path): on each SM0 reload, if SM0.DMAEN[VALDE] is set, the FlexPWM raises its value request (FlexPWM0 Val0=43, FlexPWM1 Val0=51) and the eDMA writes the next duty word into VALx -- so PWM_SetupPwmDMA no longer hangs (mcxn-flexpwm-dma). Mutation-proven on two axes: invert the VALDE gate -> no words move -> FAIL; break the per-reload deassert so the buffer drains in one reload -> the transfer finishes in ~1 period instead of ~8 -> the SysTick-measured RATE floor FAILs. And CTIMER match DMA (CTIMER{k} M0=7+2k, M1=8+2k): a match event drives the request -- the CTIMER has no DMA-enable of its own, INPUTMUX gates it -- as a one-shot pulse, one match one minor loop. This needed a new eDMA edge/pulse path: a FIFO source holds a level the drain loop keys off, but a match is an instantaneous event with no level to lower and no write-back to hook, so the engine AUTO-ACKS a pulse source after one minor loop (and drops an unconsumed pulse at BH end -- a latched one would fire spuriously when a channel is later armed). Stock-driver-shaped (mcxn-ctimer-dma): a flash pattern copied into SRAM one word per match, mutation-proven on DATA (buffer byte-exact) and RATE (8 words take >=7 self-calibrated match periods; break the auto-ack -> whole buffer in one match -> FAIL). ⚠ remaining (measured, not guessed -- the chip has 117 request sources): MICFIL/PDM (18) -- but PDM has NO bitstream source in emulation, so its FIFO stays empty and the request would never assert anyway (the gap is the missing mic, not the request line); FlexPWM capture DMA (39-42, 47-50) is the same shape -- a capture request needs an input edge on the PWM pins, which has no signal source in emulation, so the gap is the missing input, not the line; and SCT (SCT0 DMA0=19, DMA1=20) is now request-driven and stock-driver-tested too (mcxn-sct-dma): an SCT event, gated by DMAREQ0/1[DEV_n], paces the same one-word-per-event transfer through the edge path, mutation-proven on DATA (invert the DMAREQ0 gate -> no words move -> FAIL) and RATE (remove the auto-ack -> whole buffer in one event -> FAIL). And HsCmp/CMP (28-30) is now request-driven via the operator path (mcxn-cmp-dma): its crossing has no analog source in emulation, but it was already operator-driven (the comparator-output QOM property), so CCR1[DMA_EN] redirecting an IER-enabled edge to the DMA request just needed wiring. The operator injects one crossing over QMP; it pulses HsCmp0=28 and moves exactly one word -- mutation-proven on DATA (kill the pulse -> no word -> FAIL) and RATE (remove the auto-ack -> whole buffer on one crossing, out[1] moves and CITER wrong -> FAIL). And PINT (pin interrupt) is now functional and request-driven (mcxn-pint-dma): it was a register stub (IST/RISE always 0, no IRQ), and building it out earned both the pin-interrupt path and its DMA. The 8 channel input levels are operator-driven (the pin-input QOM property, like the CMP output); a rising edge on an IENR-enabled channel latches RISE+IST, raises PINT0_IRQn=47, and for channels 0..3 pulses the eDMA request (INT0..3 = sources 3..6). One operator-injected edge proves DATA (one word moved), RATE (one per edge), edge (RISE/IST latched) and NVIC (the shared handler fires) at once -- mutation-proven on all three code paths (kill the DMA pulse / the IRQ raise / the auto-ack -> FAIL). And PDM/MICFIL (18) is now operator-fed and request-driven (mcxn-pdm-dma): a mic bitstream has no source in emulation, so the mic-input QOM property pushes 24-bit samples into channel 0's FIFO; with CTRL_1[DISEL]=DMA the FIFO watermark asserts the request (a level, like the SAI -- not the pulse path) and the eDMA drains DATACH0. The harness streams a known sample sequence and the guest demands it byte-exact from memory, carried only by the DMA -- mutation-proven on DATA (zero the captured sample -> FAIL) and on the request gate (invert DISEL==DMA -> no drain -> FAIL). And FLEXPWM capture (2026-07-21, the last input-seam, now closed): the FlexPWM captures its running counter into CVAL0 on an operator-driven input-A edge (capture-a-input QOM property, CAPTCTRLA[ARMA]+EDGA0 select the edge), and DMAEN[CA0DE] pulses the capture request (source 39/47) through the edge path. mcxn-flexpwm-capture is operator-driven: a rising edge captures a counter position and the eDMA moves it to memory; the value is a BOUNDED check (in [INIT,VAL1], not byte-exact -- the operator edge is loosely coupled to the counter phase, said honestly). Mutation-proven on the two load-bearing axes: kill the capture DMA pulse -> no transfer -> FAIL; ignore EDGA0 (capture any edge) -> the negative control's falling edge is wrongly taken -> DONE fires -> FAIL. The control is positive-signal (arm rising, need 2 captures, drive fall+rise -> a correct model captures only the rising = 1, CFA0 set + DONE clear), not a delay-loop crutch. Scope: input A / capture circuit 0 / SM0; the ARMA arm-gate is modelled but not swept (disarmed-no-capture has no positive delivery signal). So NO eDMA request seam remains except PDM's missing mic bitstream, which is operator-fed too now -- every request source is wired"}
  - {block: inputmux, present: true, driver_binds: true,  class: functional,    tested_by: [mcxn-inputmux-gate, mcxn-adc-hwtrig, mcxn-adc-ctimer-trig, mcxn-adc-ctimer-adc1-trig, mcxn-adc-pwm-trig, mcxn-dac-hwtrig, mcxn-cmp-trig, mcxn-qdc-trig, mcxn-tsi-trig, mcxn-reset-values], result: pass, note: "INPUTMUX does both of its real jobs now (2026-07-12), and it did neither before. (1) trigger routing: LPTMR0 compare, CTIMER0/1/2 match-3, and FlexPWM0/1 SM0 output triggers -> INPUTMUX -> ADCn_TRIG[0..3] -> ADC hardware trigger; the same router now also drives DACn_TRIG -> DAC output-FIFO advance (mcxn-dac-hwtrig: a CTIMER match paces a waveform out of DAC0, gated by GCR[TRGSEL]) and CMPn_TRIG -> comparator round-robin sampling (mcxn-cmp-trig: a CTIMER match paces CMP0's round-robin, RRF flags a deviation, gated by RRCR0[RR_TRG_SEL]) and QDCn_TRIG -> quadrature-decoder position capture (mcxn-qdc-trig: a CTIMER match snapshots QDC0's encoder position into the hold registers / clears it, per CTRL2[UPDHLD]/[UPDPOS]) and TSI_TRIG -> touch-sensing scan (mcxn-tsi-trig: an LPTMR paces TSI0's scan, gated by GENCS[STM] hardware-trigger mode). 'Convert on a timer tick' is the canonical embedded ADC pattern and it was impossible -- the only way to start a conversion was a CPU write to SWTRIG. The stock lpadc/edma example does exactly this (INPUTMUX_AttachSignal(INPUTMUX0, 0, kINPUTMUX_Lptmr0ToAdc0Trigger); LPTMR_StartTimer) and on this model the timer ticked, the trigger went nowhere, and not one conversion ever happened -- nothing logged, nothing faulted, it just sat there. A router that routes nothing LOOKS exactly like A router. Selector 50 = LPTMR0 (and 5/6/7 = CTIMER0/1/2 match-3) are derived, not guessed: NXP's compiled driver has kINPUTMUX_Lptmr0ToAdc0Trigger = 0x2800_0032 / kINPUTMUX_Ctimer{k}M3ToAdc0Trigger = 5+k, and AttachSignal does *(base + (conn>>20) + idx*4) = conn & 0xFFFFF, i.e. 'write 50 (or 5+k) at offset 0x280'. TCTRL[HTEN] gates it; mcxn-adc-hwtrig (LPTMR) and mcxn-adc-ctimer-trig (CTIMER match) each prove both directions: routed-but-unarmed must not convert, armed must -- mutation-proven on the trigger pulse and the HTEN gate. The CTIMER's trigger-EVENT output was new: its match already drove an NVIC IRQ + eDMA request, but nothing fed the INPUTMUX, so a periodic-match-paced conversion (the motor-control current-sampling loop) was impossible. And the FlexPWM output trigger (mcxn-adc-pwm-trig, selectors 24/25/32/33 = Pwm{m}A0Trig{t}) is now modelled too -- the motor-control synchronous-sampling path: TCTRL[OUT_TRIG_EN] bit n makes the VALn compare pulse PWM_OUT_TRIG0 (even n) / TRIG1 (odd n) mid-carrier, and the ADC samples phase-current at that exact counter position; this needed real mid-period compare timing (a dedicated trigger timer -- the reload timer only knows the period edge). Mutation-proven that ignoring OUT_TRIG_EN fires extra conversions and trips the SysTick RATE floor. And the per-destination selector divergence is now modelled (mcxn-adc-ctimer-adc1-trig): the same written selector value 8 names CTIMER3 M3 for ADC0 but CTIMER3 M2 for ADC1 (9 = M3 vs M1 for CTIMER4) -- NXP's connection table. The two ADC1-facing match lines carry distinct source ids and the router remaps ADC1's selectors 8/9 to them, so one selector value reaches the right physical match per ADC. Proven by driving only CTIMER3 M2: ADC1 (sel 8 -> M2) converts, ADC0 (sel 8 -> M3, silent) does not, and ADC0 still converts on a software trigger (its HW silence is routing, not a dead ADC0); mutation-proven (drop the remap -> ADC1 falls back to the silent M3 -> FAIL). FlexPWM trigger is submodule-0, full-rate (TCTRL[TRGFRQ] every-other-period division not modelled). (2) DMA REQUEST gating: see the mcxn-inputmux-gate note. (3) All 57 RM reset values applied -- a selector that resets to 0 is not 'unconfigured', it names input 0; the real reset 0x7F means NO input connected. The old model's own comment justified the stub with 'no externally-observable behavior in emulation' -- circular: it had none only because nothing was connected to the other end. still OPEN: destinations other than the ADCs (DAC/CMP/CTIMER/SCT/FlexPWM triggers) are stored and read back correctly but nothing consumes them yet"}
